name: Site Control Centre nightly

on:
  schedule:
    # GitHub cron is UTC and often drops or delays runs, so fire every 15 minutes from 04:00 to 11:59 UTC.
    # The guard below only builds inside the 05:00 to 07:59 and 09:00 to 11:59 UK windows (BST and GMT),
    # and only once per window: later starts skip once a build exists since the window opened.
    - cron: '7,22,37,52 4-11 * * *'
  workflow_dispatch: {}

concurrency:
  group: site-cc-nightly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with: { ref: main, fetch-depth: 1, persist-credentials: false }
      - name: UK window and already built guard
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "Manual run"; echo "go=1" >> $GITHUB_OUTPUT; exit 0; fi
          H=$(TZ=Europe/London date +%H)
          case "$H" in 05|06|07) WS=05;; 09|10|11) WS=09;; *) echo "UK hour $H, outside the build windows, skipping"; echo "go=0" >> $GITHUB_OUTPUT; exit 0;; esac
          START=$(TZ=Europe/London date -d "today ${WS}:00" +%s)
          LAST=$(python3 -c 'import json,glob,datetime as d
          b=0
          for f in glob.glob("site/*/build_log.json"):
              try: b=max(b,d.datetime.strptime(json.load(open(f))["built"],"%Y-%m-%dT%H:%MZ").replace(tzinfo=d.timezone.utc).timestamp())
              except Exception: pass
          print(int(b))')
          if [ "$LAST" -ge "$START" ]; then echo "Already built at $(TZ=Europe/London date -d @$LAST +%H:%M) UK in the ${WS}:00 UK window, skipping"; echo "go=0" >> $GITHUB_OUTPUT
          else echo "No build since ${WS}:00 UK, building"; echo "go=1" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-python@v6
        if: steps.guard.outputs.go == '1'
        with: { python-version: '3.12', cache: pip, cache-dependency-path: site_cc/pipeline/requirements.txt }
      - if: steps.guard.outputs.go == '1'
        run: |
          pip install -r site_cc/pipeline/requirements.txt
          python -m playwright install --with-deps chromium   # key lines run the Keyline Control engine headless
      - name: Pull and build every live site
        if: steps.guard.outputs.go == '1'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.SITE_CC_SERVICE_ACCOUNT_JSON }}
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          OPS_ROOT: ${{ github.workspace }}
        run: bash site_cc/pipeline/run_nightly.sh
      - name: Commit and push
        if: steps.guard.outputs.go == '1' && !cancelled()
        env:
          # Same PAT the daily and broth tabs use, so the push triggers the Pages build
          GH_TOKEN: ${{ secrets.OPS_DEPLOY_TOKEN || github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site_cc/data site
          git diff --cached --quiet && { echo "No changes."; exit 0; }
          git commit -m "Site CC nightly: $(TZ=Europe/London date +'%Y-%m-%d %H:%M') UK"
          for i in 1 2 3; do git push && break; git fetch origin main && git rebase origin/main; done

name: Daily tab (cash-up + reviews + Reviews Intelligence + Deliveroo daily ops)

# Hourly on purpose, 03/09/2026. Three slots a day was not enough for two separate reasons.
# 1. GITHUB DROPS AND DELAYS CRON. Of the three scheduled slots on 02/09 the 08:15 one never ran
#    at all, and the other two started 92 and 210 minutes late. More chances beats a cleverer time.
# 2. THE SITES FILE THEIR CASH-UP THROUGH THE MORNING. The 07:37Z run found 01/09 "not filed yet";
#    the 12:47Z run built it. Running every hour means the day ships the hour it becomes
#    buildable instead of waiting for the next slot, which is what made the tab look a day behind
#    when Michael checked it around 07:30Z.
# Every run is idempotent and commits only when something changed, so the extra runs are free.
on:
  schedule:
    - cron: '30 8,9 * * *'        # 09:30 UK daily (02/10/2026). GitHub cron is UTC: 08:30Z = 09:30 BST, 09:30Z = 09:30 GMT. The other run is a free idempotent re-check.
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # 08/10/2026: the run wakes the Area Room and the Site CC (workflow_dispatch) when it ships

concurrency:
  group: daily-tab
  cancel-in-progress: false

jobs:
  build-and-ship:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install --quiet google-auth requests google-api-python-client

      # 07/10/2026: Deliveroo daily ops ride the same run as the cash-up and reviews, so the AM CC daily tab
      # (Deliveroo chip and panel) and the Area Room update together. Source: Deliveroo Daily Master sheet, filled
      # hourly by the Apps Script from Brogan's morning drops. The file lands in data/ before the build below, so
      # daily_cloud_run.py ships it in the same commit. A failed pull keeps the last good file and never blocks the tab.
      - name: Deliveroo daily ops (estate file)
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.SITE_CC_SERVICE_ACCOUNT_JSON }}
        run: python3 site_cc/pipeline/pull_deliveroo_daily.py --estate data/deliveroo_daily.json

      - name: Fetch the two Drive mirrors (twice each, must be byte-identical)
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python3 builders/fetch_mirrors.py --out /tmp/mirrors

      - name: Build, diff, commit, push
        id: run
        env:
          # A fine-grained PAT (Contents RW on this repo) so the push triggers the Pages build.
          # Falls back to the job token if the secret is absent.
          GH_TOKEN: ${{ secrets.OPS_DEPLOY_TOKEN || github.token }}
        run: |
          set +e
          python3 builders/daily_cloud_run.py --repo . \
            --cashup /tmp/mirrors/cashup_1.csv /tmp/mirrors/cashup_2.csv \
            --reviews /tmp/mirrors/reviews_1.csv /tmp/mirrors/reviews_2.csv \
            --report data/daily/run_report.json > /tmp/report.json 2> /tmp/run.err
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          echo "## Daily tab run (exit $code)" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          try:
              R = json.load(open('/tmp/report.json'))
          except Exception as e:
              print('no report:', e); raise SystemExit
          print(f"- day {R['day']} · result: **{R.get('result')}** · pushed: {R.get('pushed')} · commit `{(R.get('commit') or '')[:7]}`")
          print(f"- gate: {R['cashup'].get('D_gate')}")
          t = R['cashup'].get('D_totals')
          if t: print(f"- sales £{t['sales']:,.2f} vs £{t['target']:,.2f} ({t['vs_target_pct']:+}%), covers {t['covers']:,}, avg £{t['avg_spend']}, wage {t['wage_pct']}%, sites {t['sites']}, splits {t['splits']}")
          w = R.get('intel', {}).get('week_in_progress')
          if w: print(f"- reviews week in progress w/c {w['week']}: {w['reviews']} reviews, {w['negatives']} neg, {w['avg']}★ over {len(w['days'])} day(s)")
          for x in R.get('warnings', []): print('- ⚠️', x)
          PY
          echo '### stderr tail' >> "$GITHUB_STEP_SUMMARY"; tail -n 25 /tmp/run.err >> "$GITHUB_STEP_SUMMARY"
          # 0 = shipped or nothing to ship; 11 = D not filed yet (normal at 12:15). Anything else fails the job loudly.
          if [ "$code" = "0" ] || [ "$code" = "11" ]; then exit 0; else exit "$code"; fi

      # When the cash-up has nothing new (exit 11) the build ships nothing, so ship the Deliveroo file on its own.
      - name: Ship Deliveroo daily ops if the build did not
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPS_DEPLOY_TOKEN || github.token }}
        run: |
          if [ -z "$(git status --porcelain -- data/deliveroo_daily.json)" ]; then echo "Deliveroo daily ops: nothing to ship"; exit 0; fi
          git config user.name "maki-nori"; git config user.email "michael@makiramen.com"
          git add data/deliveroo_daily.json
          git commit -q -m "Deliveroo daily ops: $(TZ=Europe/London date +'%Y-%m-%d %H:%M') UK"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          for i in 1 2 3; do git push "$URL" HEAD:main && exit 0; git fetch "$URL" main && git rebase FETCH_HEAD; done
          exit 1

      # 08/10/2026: chained morning build. workflow_run does not reach the Area Room or the Site CC reliably (runs the
      # scheduler starts with the job token raise no events), so the daily tab dispatches them itself, but
      # only when this run shipped the cash-up or reviews. Each has its own guard, so a redundant dispatch is a no-op.
      - name: Wake the Area Room and the Site CC when something shipped
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}   # the job token dispatches fine (the reliable scheduler proves it daily)
        run: |
          shipped=$(python3 -c "import json;R=json.load(open('/tmp/report.json'));print(1 if R.get('shipped') else 0)" 2>/dev/null || echo 0)
          if [ "$shipped" != "1" ]; then echo "nothing shipped, not waking the Area Room or the Site CC"; exit 0; fi
          for wf in area-room.yml site-cc-nightly.yml; do
            curl -sS -o /dev/null -w "$wf dispatch: %{http_code}\n" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$wf/dispatches" \
              -d '{"ref":"main","inputs":{"chained":"true"}}' || true
          done

      - name: Keep the report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-tab-run-${{ github.run_id }}
          path: |
            /tmp/report.json
            /tmp/run.err
          retention-days: 14

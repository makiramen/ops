name: KPI sheet automation (Kobas pulls)

# Pulls Kobas straight (keyline bot user), no email skim, no Mac. Outputs are a short-lived run artifact,
# nothing is committed. Results also go to the KPI Auto sheet (to_sheet.py). mode=probe finds routes, mode=pull does the October reconciliation pull.
on:
  schedule:
    # Daily 04:10 UTC (Michael approved 23/10/2026): pulls yesterday straight after Kobas sends the Daily Headline Revenue
    # report (04:00 UK) and freezes it into Kobas_Daily. Since 24/10/2026 (Michael) the run APPLIES the manager-typed
    # DAY (Input) fields (Covers, Drinks %, Sushi %, Sides %) into every site KPI sheet: blank/zero cells only, never a
    # typed figure, never a formula, never a new row. Script Data stays plan-only (the email skim still fills it).
    # Same run pushes the KPI sheet targets (Sit In + Delivery) into Kobas Sales Budgets for the next 28 days (25 Dec skipped).
    # 29/10/2026 (Michael): Covers = Kobas covers + tabs without covers set + round(Stripe £/22) for all 20 sites; the Covers,
    # Drinks %, Sushi %, Sides % FORMULA cells are replaced with the Kobas value; Auto Cash Up 'Raw Data 2' fed from Kobas_Daily
    # (cashup_feed.py); one Run_History line per run and a failure email to Michael. A scheduled run reads kpi_auto/backfill.json
    # ({"from": "2026-09-28"}) when present: it pulls from that date instead of yesterday, then deletes the file (one-off backfill).
    - cron: '10 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe, pull, or skip (no Kobas pull: writer plans from the Kobas_Daily already in the sheet)'
        default: 'pull'
      date_from:
        default: '2026-09-28'
      date_to:
        default: '2026-10-21'
      write_mode:
        description: 'writer: plan (writes nothing to site sheets, only Layout/Write_Plan to KPI Auto) or apply'
        default: 'plan'
      cashup_mode:
        description: 'Auto Cash Up Raw Data 2 feed from Kobas_Daily: plan (CashUp_Plan tab only) or apply'
        default: 'plan'
      apply_fields:
        description: 'apply only: comma list of fields allowed to be filled, e.g. Actual (empty = none)'
        default: ''
      labour_fresh:
        description: '1 = queue a fresh Labour Costs report per week in range (the morning snapshot)'
        default: '0'
      forecast:
        description: 'Kobas sales forecast push, rolling 28 days from the KPI sheets: plan, apply or skip (schedule = apply)'
        default: 'plan'
      forecast_sites:
        description: 'forecast push: comma list of sites (empty = all 20)'
        default: ''
      plan_to_repo:
        description: '1 = commit the DAY (Input) plan CSV (kpi_auto/plan/day_plan_<from>_<to>.csv) to main for reading in chat'
        default: '0'
      site_sheets:
        description: 'TRIAL: JSON map of site code -> sheet id, e.g. {"M3":"13KD..."}; when set the run writes ONLY to those sheets (no live site sheet is touched)'
        default: ''

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests google-auth google-api-python-client
      - name: Dates (scheduled run = yesterday, UK)
        run: |
          F="${{ inputs.date_from }}"; T="${{ inputs.date_to }}"; LF="${{ inputs.labour_fresh }}"
          M="${{ inputs.mode }}"; W="${{ inputs.write_mode }}"; AF="${{ inputs.apply_fields }}"; CM="${{ inputs.cashup_mode }}"; BF=0
          if [ "${{ github.event_name }}" = "schedule" ]; then
            F=$(TZ=Europe/London date -d yesterday +%F); T=$F; LF=1; M=pull
            W=apply; AF="Covers,Drinks %,Sushi %,Sides %"   # DAY (Input) fields live from 24/10/2026 (Michael)
            CM=plan   # 29/10/2026: apply PAUSED. Raw Data 2 is one IMPORTRANGE array (A1), writing into it breaks the array (#REF!) and stops the daily cash-up. Re-enable only once the feed targets a real tab.
            if [ -f kpi_auto/backfill.json ]; then          # one-off backfill (29/10/2026): pull from the date in the file, then drop it
              B=$(python3 -c "import json;print(json.load(open('kpi_auto/backfill.json')).get('from',''))"); [ -n "$B" ] && F=$B && BF=1
            fi
          fi
          echo "DATE_FROM=${F:-2026-09-28}" >> $GITHUB_ENV; echo "DATE_TO=${T:-2026-10-21}" >> $GITHUB_ENV; echo "LABOUR_FRESH=${LF:-0}" >> $GITHUB_ENV
          echo "MODE=${M:-pull}" >> $GITHUB_ENV; echo "WRITE_MODE=${W:-plan}" >> $GITHUB_ENV; echo "APPLY_FIELDS=$AF" >> $GITHUB_ENV
          echo "CASHUP_MODE=${CM:-plan}" >> $GITHUB_ENV; echo "BACKFILL=$BF" >> $GITHUB_ENV
          echo "REPLACE_FORMULAS=Covers,Drinks %,Sushi %,Sides %" >> $GITHUB_ENV   # 29/10/2026: formula cells replaced with Kobas values
          echo 'SITE_SHEETS=${{ inputs.site_sheets }}' >> $GITHUB_ENV   # TRIAL override (29/10/2026), empty on schedule
      - name: Run
        env:
          TZ: Europe/London
          KOBAS_COMPANY_ID: ${{ secrets.KOBAS_COMPANY_ID }}
          KOBAS_USERNAME: ${{ secrets.KOBAS_USERNAME }}
          KOBAS_PASSWORD: ${{ secrets.KOBAS_PASSWORD }}
        run: mkdir -p /tmp/kpi_out; [ "$MODE" = skip ] || python3 kpi_auto/$MODE.py /tmp/kpi_out
      - name: Push sales forecast to Kobas (rolling 28 days, Rotas > Sales Budgets)
        if: always()
        env:
          TZ: Europe/London
          KOBAS_COMPANY_ID: ${{ secrets.KOBAS_COMPANY_ID }}
          KOBAS_USERNAME: ${{ secrets.KOBAS_USERNAME }}
          KOBAS_PASSWORD: ${{ secrets.KOBAS_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.SITE_CC_SERVICE_ACCOUNT_JSON }}
          FORECAST_SITES: ${{ inputs.forecast_sites }}
        run: |
          FM="${{ inputs.forecast }}"; [ "${{ github.event_name }}" = "schedule" ] && FM=apply
          echo "forecast mode ${FM:-plan}" > /tmp/forecast.log
          if [ "${FM:-plan}" = "skip" ]; then exit 0; fi
          rc=0; FORECAST_MODE=${FM:-plan} python3 kpi_auto/forecast_push.py >> /tmp/forecast.log 2>&1 || rc=$?
          cat /tmp/forecast.log; exit $rc
      - name: Write to the KPI Auto sheet
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.SITE_CC_SERVICE_ACCOUNT_JSON }}
          PLAN_OUT: /tmp/kpi_out
        run: |
          rc=0
          if [ "$MODE" = skip ]; then echo 'mode skip: Kobas_Daily left as is' > /tmp/to_sheet.log; else
          python3 kpi_auto/to_sheet.py /tmp/kpi_out > /tmp/to_sheet.log 2>&1 || rc=1
          python3 kpi_auto/kobas_daily.py /tmp/kpi_out >> /tmp/to_sheet.log 2>&1 || rc=1; fi
          python3 kpi_auto/kpi_sheets.py > /tmp/kpi_sheets.log 2>&1 || rc=1
          python3 kpi_auto/writer.py > /tmp/writer.log 2>&1 || rc=1
          python3 kpi_auto/cashup_feed.py > /tmp/cashup.log 2>&1 || rc=1
          cat /tmp/to_sheet.log /tmp/kpi_sheets.log /tmp/writer.log /tmp/cashup.log
          python3 kpi_auto/log_to_sheet.py /tmp/to_sheet.log /tmp/kpi_sheets.log /tmp/writer.log /tmp/cashup.log /tmp/forecast.log
          exit $rc
      - name: Run_History line (and failure email to Michael)
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.SITE_CC_SERVICE_ACCOUNT_JSON }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          ST=ok; [ "${{ job.status }}" = "success" ] || ST=FAILED
          for f in /tmp/to_sheet.log /tmp/kpi_sheets.log /tmp/writer.log /tmp/cashup.log /tmp/forecast.log; do [ -f $f ] || echo "(step did not run)" > $f; done
          grep -q -E "Traceback|NO ACCESS" /tmp/to_sheet.log /tmp/writer.log /tmp/cashup.log && ST=FAILED
          python3 kpi_auto/run_history.py $ST /tmp/to_sheet.log /tmp/kpi_sheets.log /tmp/writer.log /tmp/cashup.log /tmp/forecast.log
      - name: Backfill done, drop kpi_auto/backfill.json (scheduled backfill run only)
        if: success() && github.event_name == 'schedule' && env.BACKFILL == '1'
        run: |
          git rm -q kpi_auto/backfill.json
          git config user.name 'kpi-auto bot'; git config user.email 'ops@makiramen.com'
          git commit -m "kpi_auto: backfill ${DATE_FROM}..${DATE_TO} done, backfill.json dropped" || exit 0
          git pull --rebase https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} main
          git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:main
      - name: Commit the DAY (Input) plan CSV to the repo (dispatch with plan_to_repo=1 only)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.plan_to_repo == '1'
        run: |
          [ -f /tmp/kpi_out/day_plan.csv ] || { echo 'no day_plan.csv'; exit 0; }
          mkdir -p kpi_auto/plan && cp /tmp/kpi_out/day_plan.csv "kpi_auto/plan/day_plan_${DATE_FROM}_${DATE_TO}.csv"
          cp /tmp/writer.log "kpi_auto/plan/writer_${DATE_FROM}_${DATE_TO}.log" || true
          cp /tmp/kpi_out/layout.csv "kpi_auto/plan/layout_${DATE_FROM}_${DATE_TO}.csv" || true
          git config user.name 'kpi-auto bot'; git config user.email 'ops@makiramen.com'
          git add kpi_auto/plan && git commit -m "kpi_auto: DAY (Input) plan ${DATE_FROM}..${DATE_TO} (${WRITE_MODE})" || exit 0
          git pull --rebase https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} main
          git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kpi-${{ inputs.mode }}-${{ github.run_id }}
          path: /tmp/kpi_out
          retention-days: 2

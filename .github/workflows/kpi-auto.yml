name: KPI sheet automation (Kobas pulls)

# Pulls Kobas straight (keyline bot user), no email skim, no Mac. Outputs are a short-lived run artifact,
# nothing is committed. Results also go to the KPI Auto sheet (to_sheet.py). mode=probe finds routes, mode=pull does the October reconciliation pull.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe or pull'
        default: 'pull'
      date_from:
        default: '2026-09-28'
      date_to:
        default: '2026-10-21'
      write_mode:
        description: 'writer: plan (writes nothing to site sheets, only Layout/Write_Plan to KPI Auto) or apply'
        default: 'plan'
      apply_fields:
        description: 'apply only: comma list of fields allowed to be filled, e.g. Actual (empty = none)'
        default: ''
      labour_fresh:
        description: '1 = queue a fresh Labour Costs report per week in range (the morning snapshot)'
        default: '0'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests google-auth google-api-python-client
      - name: Run
        env:
          TZ: Europe/London
          KOBAS_COMPANY_ID: ${{ secrets.KOBAS_COMPANY_ID }}
          KOBAS_USERNAME: ${{ secrets.KOBAS_USERNAME }}
          KOBAS_PASSWORD: ${{ secrets.KOBAS_PASSWORD }}
          DATE_FROM: ${{ inputs.date_from }}
          DATE_TO: ${{ inputs.date_to }}
          LABOUR_FRESH: ${{ inputs.labour_fresh }}
        run: python3 kpi_auto/${{ inputs.mode }}.py /tmp/kpi_out
      - name: Write to the KPI Auto sheet
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.SITE_CC_SERVICE_ACCOUNT_JSON }}
          DATE_FROM: ${{ inputs.date_from }}
          DATE_TO: ${{ inputs.date_to }}
          WRITE_MODE: ${{ inputs.write_mode }}
          APPLY_FIELDS: ${{ inputs.apply_fields }}
        run: |
          rc=0
          python3 kpi_auto/to_sheet.py /tmp/kpi_out > /tmp/to_sheet.log 2>&1 || rc=1
          python3 kpi_auto/kpi_sheets.py > /tmp/kpi_sheets.log 2>&1 || rc=1
          python3 kpi_auto/writer.py > /tmp/writer.log 2>&1 || rc=1
          cat /tmp/to_sheet.log /tmp/kpi_sheets.log /tmp/writer.log
          python3 kpi_auto/log_to_sheet.py /tmp/to_sheet.log /tmp/kpi_sheets.log /tmp/writer.log
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kpi-${{ inputs.mode }}-${{ github.run_id }}
          path: /tmp/kpi_out
          retention-days: 2

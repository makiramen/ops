name: KPI sheet automation (Kobas pulls)

# Pulls Kobas straight (keyline bot user), no email skim, no Mac. Outputs are a short-lived run artifact,
# nothing is committed. mode=probe finds routes, mode=pull does the October reconciliation pull.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe or pull'
        default: 'probe'
      date_from:
        default: '2026-09-28'
      date_to:
        default: '2026-10-21'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests
      - name: Run
        env:
          TZ: Europe/London
          KOBAS_COMPANY_ID: ${{ secrets.KOBAS_COMPANY_ID }}
          KOBAS_USERNAME: ${{ secrets.KOBAS_USERNAME }}
          KOBAS_PASSWORD: ${{ secrets.KOBAS_PASSWORD }}
          DATE_FROM: ${{ inputs.date_from }}
          DATE_TO: ${{ inputs.date_to }}
        run: python3 kpi_auto/${{ inputs.mode }}.py /tmp/kpi_out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kpi-${{ inputs.mode }}-${{ github.run_id }}
          path: /tmp/kpi_out
          retention-days: 2

name: EC ledger post (inbox to Sheet)

# 13/10/2026. The EC Daily Spend Ledger rows used to be POSTed to the Apps Script appender from Michael's Chrome
# (the cloud sandbox cannot reach script.google.com), so the ledger stalled whenever his Mac was off. Now the skim
# commits the payload into data/ec_ledger_inbox/ and this runner, which can reach Google, does the POST.
# Idempotent: the appender upserts on (date, site_code), and every applied file is moved to applied/.

on:
  push:
    branches: [main]
    paths: ['data/ec_ledger_inbox/*.json']
  workflow_dispatch: {}
  schedule:
    - cron: '50 7,9,11 * * *'   # backup sweep, UTC

permissions:
  contents: write
  actions: write

concurrency:
  group: ec-ledger-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Post pending payloads to the appender
        id: post
        env:
          APPENDER_URL: ${{ secrets.EC_APPENDER_URL }}
        run: |
          python3 - <<'PY'
          import os, json, glob, time, shutil, urllib.request, urllib.error
          from datetime import datetime, timezone
          url = os.environ.get('APPENDER_URL', '').strip()
          if not url:
              raise SystemExit('EC_APPENDER_URL secret is not set')
          files = sorted(glob.glob('data/ec_ledger_inbox/*.json'))
          posted = []
          for f in files:
              with open(f) as fh: payload = json.load(fh)
              rows = payload.get('rows') or []
              body = json.dumps({'mode': payload.get('mode', 'upsert'), 'rows': rows}).encode()
              resp = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, data=body, headers={'Content-Type': 'application/json'}, method='POST')
                      with urllib.request.urlopen(req, timeout=90) as r:
                          resp = r.read().decode()
                      break
                  except urllib.error.HTTPError as e:
                      resp = f'HTTP {e.code}: {e.read().decode()[:300]}'
                  except Exception as e:
                      resp = f'error: {e}'
                  time.sleep(10 * (attempt + 1))
              ok = False
              try:
                  j = json.loads(resp); ok = bool(j.get('ok'))
              except Exception:
                  pass
              print(f'{f}: {len(rows)} rows -> {resp[:200]}')
              if not ok:
                  raise SystemExit(f'appender refused {f}: {resp[:300]}')
              payload['_applied'] = {'at': datetime.now(timezone.utc).isoformat(timespec="seconds"), 'response': resp[:300]}
              dest = 'data/ec_ledger_inbox/applied/' + os.path.basename(f)
              with open(dest, 'w') as fh: json.dump(payload, fh, indent=1); fh.write('\n')
              os.remove(f)
              posted.append(os.path.basename(f))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as o:
              o.write('posted=' + (','.join(posted) if posted else '') + '\n')
          print('posted:', posted or 'nothing pending')
          PY

      - name: Commit the applied files
        if: steps.post.outputs.posted != ''
        env:
          GH_TOKEN: ${{ secrets.OPS_DEPLOY_TOKEN || github.token }}
        run: |
          set -e
          git config user.name  maki-nori
          git config user.email michael@makiramen.com
          git add data/ec_ledger_inbox
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -q -m "EC ledger: posted ${{ steps.post.outputs.posted }} to the Sheet" \
            -m "Co-Authored-By: Claude <noreply@anthropic.com>"
          git pull -q --rebase origin main || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Bake the Budget Burn snapshot
        if: steps.post.outputs.posted != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 20
          gh workflow run budget-burn-snapshot.yml -R "$GITHUB_REPOSITORY" --ref main && echo "budget-burn dispatched"

name: Auto Cash Up feed undo (clear the cells the feed wrote into Raw Data 2)
on:
  workflow_dispatch:
    inputs:
      apply:
        description: '1 = clear the cells, anything else = dry run'
        default: '0'
jobs:
  undo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q google-auth google-api-python-client
      - env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.SITE_CC_SERVICE_ACCOUNT_JSON }}
          UNDO_APPLY: ${{ inputs.apply }}
        run: python3 kpi_auto/cashup_feed_undo.py

<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Hajime Owari Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Shippori+Mincho+B1:wght@600;800&display=swap">
<style>
:root{
  --bg:#faf7f4;--card:#ffffff;--card2:#f5f0eb;--line:#e8dfd7;--txt:#1d1714;--mut:#76695e;
  --acc:#E94E1B;--accd:#b93a10;--tint:#fff0e8;--onacc:#ffffff;
  --rd:#c62828;--amb:#c98a0b;--grn:#2f8f5b;--shadow:0 1px 2px rgba(60,30,10,.06);
  --disp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141110;--card:#1d1917;--card2:#26201d;--line:#3a312c;--txt:#f3ede8;--mut:#ab9e93;
  --acc:#F2692F;--accd:#ff8a5c;--tint:#3a2116;--onacc:#1a0d06;
  --rd:#ef5a57;--amb:#e3a92c;--grn:#4fb47f;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#141110;--card:#1d1917;--card2:#26201d;--line:#3a312c;--txt:#f3ede8;--mut:#ab9e93;
  --acc:#F2692F;--accd:#ff8a5c;--tint:#3a2116;--onacc:#1a0d06;
  --rd:#ef5a57;--amb:#e3a92c;--grn:#4fb47f;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 var(--body);padding-bottom:88px}
#barBtns{display:flex;gap:8px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:18px 8px}
h1,h2{font-family:var(--disp);text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* masthead */
.mast{display:grid;grid-template-columns:1fr auto;gap:14px 24px;align-items:end;padding-block:8px 18px;border-bottom:2px solid var(--txt)}
.mast .eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
.mast h1{font-size:clamp(28px,6vw,44px);font-weight:800;line-height:1.05;margin-top:4px}
.mast .sub{color:var(--mut);font-size:13.5px;margin-top:6px}
.pct{text-align:right}
.pct b{font:500 34px/1 var(--mono);font-variant-numeric:tabular-nums}
.pct span{display:block;font-size:11.5px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.meter{grid-column:1/-1;height:6px;background:var(--card2);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}

/* phase rail */
.rail{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:18px 0 6px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.ph{padding:12px 14px;border-right:1px solid var(--line);cursor:pointer;background:none;border-top:0;border-bottom:0;border-left:0;text-align:left}
.ph:last-child{border-right:0}
.ph .k{font:800 26px/1 var(--disp);color:var(--mut)}
.ph .n{font-weight:600;font-size:14px;margin-top:6px}
.ph .d{font-size:12px;color:var(--mut);margin-top:2px}
.ph.on{background:var(--tint)}
.ph.on .k{color:var(--acc)}
.ph.done .k{color:var(--grn)}
.railnote{font-size:12px;color:var(--mut);margin:0 0 4px}

/* key dates */
.dates{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.dt{flex:1 1 150px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--card)}
.dt b{display:block;font:500 13px/1.2 var(--mono);color:var(--acc)}
.dt span{font-size:12.5px}
.dt.warn{border-color:var(--amb)}
.dt.warn b{color:var(--amb)}

/* nav */
nav.toc{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);border-bottom:1px solid var(--line);margin:14px -16px 0;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.toc a{flex:0 0 auto;font-size:12.5px;text-decoration:none;color:var(--mut);padding:5px 10px;border-radius:20px;border:1px solid var(--line);background:var(--card)}
nav.toc a:hover{color:var(--txt);border-color:var(--acc)}

section{padding-block:22px 6px;border-bottom:1px solid var(--line)}
section:last-of-type{border-bottom:0}
.sh{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.sh .no{font:500 12px var(--mono);color:var(--acc)}
.sh h2{font-size:21px;font-weight:800}
.lead{font-size:13.5px;color:var(--mut);margin:2px 0 12px;max-width:68ch}
h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:18px 0 4px;font-weight:600}
label{display:block;font-size:11.5px;color:var(--mut);margin:0 0 4px;letter-spacing:.05em;text-transform:uppercase}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
textarea{min-height:70px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

/* checklist */
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 12px}
.it{display:flex;gap:11px;align-items:flex-start;border-bottom:1px solid var(--line);padding:10px 0}
.it:last-child{border-bottom:0}
.tk{flex:0 0 24px;width:24px;height:24px;border-radius:6px;border:1.5px solid var(--line);background:var(--card2);cursor:pointer;color:transparent;font:700 14px/1 var(--body);padding:0;margin-top:1px}
.tk:hover{border-color:var(--acc)}
.tk.on{background:var(--grn);border-color:var(--grn);color:#fff}
.bd{flex:1;min-width:0}
.bd .t{font-size:14px;margin-bottom:5px}
.it.done .t{color:var(--mut)}
.bd .g{font-size:12px;color:var(--mut);margin:-2px 0 6px}
.bd input{padding:6px 9px;font-size:13px}
.cnt{font:500 12px var(--mono);color:var(--mut);float:right;letter-spacing:0;text-transform:none}

/* rag */
.rag{display:flex;gap:4px;flex:0 0 auto}
.rag button{width:34px;height:32px;background:var(--card2);border:1px solid var(--line);border-radius:7px;color:var(--mut);font:600 12px/1 var(--mono);cursor:pointer}
.rag button.on{color:#fff;border-color:transparent}
.rag button.on[data-v="R"]{background:var(--rd)}
.rag button.on[data-v="A"]{background:var(--amb)}
.rag button.on[data-v="G"]{background:var(--grn)}
.mrow{display:flex;gap:11px;align-items:flex-start;border-bottom:1px solid var(--line);padding:11px 0}
.mrow:last-child{border-bottom:0}
.grp{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:600;padding:14px 0 2px;border-bottom:1px solid var(--line)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--mut);margin-left:6px;vertical-align:1px}
.flds{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.flds>div{flex:0 1 170px}
.flds>div.wide{flex:1 1 100%}
.flds label{text-transform:none;letter-spacing:0;font-size:12px}

/* tally */
.tally{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--mut)}
.tag b{color:var(--txt);font-family:var(--mono);font-weight:500}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dR{background:var(--rd)}.dA{background:var(--amb)}.dG{background:var(--grn)}

/* owari weeks */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:760px;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:left;font-weight:600;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td input{padding:6px 7px;font:500 13px var(--mono)}
td.wk{font:500 13px var(--mono);color:var(--mut);white-space:nowrap}
.st{display:inline-block;min-width:74px;text-align:center;border-radius:20px;padding:3px 8px;font-size:11.5px;font-weight:600;color:var(--mut);border:1px solid var(--line)}
.st.G{background:var(--grn);color:#fff;border-color:transparent}
.st.R{background:var(--rd);color:#fff;border-color:transparent}
.st.A{background:var(--amb);color:#fff;border-color:transparent}
.streak{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:12px 0 2px}
.pips{display:flex;gap:5px}
.pips i{width:30px;height:10px;border-radius:3px;background:var(--card2);border:1px solid var(--line)}
.pips i.on{background:var(--grn);border-color:var(--grn)}
.streak p{margin:0;font-size:13.5px}

/* actions */
.act{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:10px 12px 12px;margin:8px 0;position:relative}
.act[data-rag="R"]{border-left-color:var(--rd)}
.act[data-rag="A"]{border-left-color:var(--amb)}
.act[data-rag="G"]{border-left-color:var(--grn)}
.act .del{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer;line-height:1}
.act .n{font:500 11px var(--mono);color:var(--mut)}
.act .row{display:grid;grid-template-columns:2fr 1.3fr 1fr .6fr;gap:8px;margin-top:8px}
@media (max-width:620px){.act .row{grid-template-columns:1fr 1fr}}
.add{background:none;border:1px dashed var(--line);border-radius:10px;padding:11px;width:100%;cursor:pointer;color:var(--mut)}
.add:hover{border-color:var(--acc);color:var(--acc)}

.dec{display:flex;gap:8px;flex-wrap:wrap}
.dec button{flex:1 1 220px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;text-align:left}
.dec button.on{border-color:var(--acc);background:var(--tint);box-shadow:inset 0 0 0 1px var(--acc)}
.sign{display:grid;grid-template-columns:1.4fr .7fr .9fr;gap:8px;border-bottom:1px solid var(--line);padding:9px 0}
@media (max-width:560px){.sign{grid-template-columns:1fr 1fr}.sign>div:first-child{grid-column:1/-1}}

.sigwrap{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end;margin-top:10px}
.sigbox{flex:0 1 300px}
.sigline{font:400 32px/1.1 "Snell Roundhand","Segoe Script","Brush Script MT","Apple Chancery",cursive;padding:2px 4px 6px}
.sigrule{border-bottom:1.5px solid var(--txt);margin-bottom:7px}
.signame{font-weight:600;font-size:13.5px}
.sigrole{font-size:12px;color:var(--mut)}
.sigmeta{flex:1 1 280px;font-size:12px;color:var(--mut);border-left:3px solid var(--acc);padding-left:12px}
.sigmeta div{padding:2px 0}
.sigmeta span{display:inline-block;min-width:84px;color:var(--txt);font-weight:600}

/* bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:9px 16px calc(9px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center}
.bar .stat{flex:1;font-size:12.5px;color:var(--mut);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .stat i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut);margin-right:6px}
.bar .stat.ok i{background:var(--grn)}
.bar .stat.busy i{background:var(--amb)}
.bar .btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:10px 14px;font-weight:600;font-size:13px;cursor:pointer}
.bar .pri{background:var(--acc);color:var(--onacc);border-color:transparent}
#toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{body{padding:0;background:#fff;color:#000}.bar,.add,.del,nav.toc,#toast{display:none}section{break-inside:avoid-page}}
</style>
<style>
/* home */
.homehead{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-block:8px 18px;border-bottom:2px solid var(--txt)}
.homehead h1{font-size:clamp(28px,6vw,44px);font-weight:800;line-height:1.05;margin-top:4px}
.homehead .eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
.homehead .sub{color:var(--mut);font-size:13.5px;margin-top:6px;max-width:60ch}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:10px 14px;font-weight:600;font-size:13px;cursor:pointer}
.btn.pri{background:var(--acc);color:var(--onacc);border-color:transparent}
.btn.ghost{background:none}
.btn.danger{color:var(--rd);border-color:color-mix(in srgb,var(--rd) 45%,var(--line))}
.btn.danger.arm{background:var(--rd);color:#fff;border-color:transparent}
.newform{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
.newform h2{font-size:19px;margin-bottom:10px}
.newform .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.err{color:var(--rd);font-size:13px;margin-top:8px;min-height:1em}
.phgroup{margin-top:22px}
.phgroup>h3{display:flex;align-items:baseline;gap:8px;margin:0 0 10px}
.phgroup>h3 .kj{font:800 18px var(--disp);color:var(--acc);text-transform:none;letter-spacing:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.rc{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);transition:border-color .15s}
.rc:hover{border-color:var(--acc)}
.rc .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rc .nm{font:800 20px/1.15 var(--disp)}
.rc .cl{font-size:12.5px;color:var(--mut);margin-top:3px}
.rc .kj{font:800 26px/1 var(--disp);color:var(--acc)}
.rc .kj.done{color:var(--grn)}
.rc .m{height:5px;background:var(--card2);border-radius:5px;overflow:hidden;margin:12px 0 8px}
.rc .m i{display:block;height:100%;background:var(--acc)}
.rc .row2{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--mut)}
.rc .row2 b{font-family:var(--mono);font-weight:500;color:var(--txt)}
.rc .foot{font-size:11.5px;color:var(--mut);margin-top:10px;border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;gap:8px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--mut);margin-top:18px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);text-decoration:none;margin-bottom:10px}
.back:hover{color:var(--acc)}
.miles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dt.none b{color:var(--mut)}
.danger-zone{margin-top:26px;display:flex;justify-content:flex-end}
</style>
</head>

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function hhmm(t){var d=new Date(t);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function ukDate(iso){if(!iso)return '';var p=iso.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso}
function ago(t){if(!t)return 'never saved';var d=new Date(t);return ukDate(d.toISOString().slice(0,10))+' '+hhmm(t)}
function slug(s){return String(s).toLowerCase().normalize('NFKD').replace(/[^\w\s-]/g,'').trim().replace(/[\s_]+/g,'-').replace(/-+/g,'-').slice(0,60)||'site'}

var API='https://script.google.com/macros/s/AKfycbwttmXDnxS6zSOXF6UPHFmjFZnkgRw9mezBADlS-U-9X3zkQQ63YX9lgtd2lvsRzUs-LA/exec', online=false, reports={};
function localAll(){try{return JSON.parse(localStorage.getItem(LKEY)||'{}')}catch(e){return {}}}
function localPut(id,d){try{var a=localAll();a[id]=d;localStorage.setItem(LKEY,JSON.stringify(a))}catch(e){}}
function localDel(id){try{var a=localAll();delete a[id];localStorage.setItem(LKEY,JSON.stringify(a))}catch(e){}}
function code(){try{return localStorage.getItem('ho_team_code')||''}catch(e){return window.__code||''}}

function post(body){body.key=code();return fetch(API,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){return r.json()}).then(function(j){if(!j.ok)throw j;return j})}
function fetchAll(){return fetch(API+'?key='+encodeURIComponent(code())+'&t='+Date.now(),{credentials:'omit'}).then(function(r){return r.json()})}
function storeSet(id,d){localPut(id,d);return post({action:'set',id:id,doc:d}).then(function(){online=true;return 'shared'})}

  (d.acts||[]).forEach(function(id){S.acts.push(id);$('actions').appendChild(actRow(id))});
  S.nextAct=Math.max(d.nextAct||1,S.acts.length?Math.max.apply(null,S.acts)+1:1);
  var f=d.fields||{};
  document.querySelectorAll('#view input[id],#view select[id],#view textarea[id]').forEach(function(e){e.value=f[e.id]!=null?f[e.id]:''});
  for(var k in f){var e=$(k);if(e&&e.tagName==='SELECT'&&f[k]&&e.value!==f[k]){var o=document.createElement('option');o.textContent=f[k];e.appendChild(o);e.value=f[k]}}
  S.acts.forEach(function(id){var r=$('a'+id+'_r');if(r)r.closest('.act').dataset.rag=r.value||'R'});
  paint();
}
function paint(){
  document.querySelectorAll('.tk').forEach(function(b){var on=!!S.tick[b.dataset.k];b.classList.toggle('on',on);b.closest('.it').classList.toggle('done',on)});
  document.querySelectorAll('.rag button').forEach(function(b){b.classList.toggle('on',S.rag[b.dataset.k]===b.dataset.v)});
  document.querySelectorAll('#dec button').forEach(function(b){b.classList.toggle('on',b.dataset.d===S.dec)});
  var pi=PHASES.map(function(p){return p[0]}).indexOf(S.phase);
  document.querySelectorAll('.ph').forEach(function(b,i){b.classList.toggle('on',i===pi);b.classList.toggle('done',i<pi);b.setAttribute('aria-pressed',i===pi)});
  upd();
}
function num(id){var e=$(id);var v=(e&&e.value||'').replace(/[£,%★\s]/g,'');return v===''?null:parseFloat(v)}
function weekStatus(i){
  var s=num('w'+i+'_sales'),t=num('w'+i+'_tgt'),w=num('w'+i+'_wage'),fd=num('w'+i+'_food'),st=num('w'+i+'_star'),c=[];
  if(s!==null&&t!==null)c.push(s>=t);if(w!==null)c.push(w<=27);if(fd!==null)c.push(fd<=25);if(st!==null)c.push(st>=4.7);
  if(!c.length)return '';var miss=c.filter(function(x){return !x}).length;return miss===0?'G':(miss===1?'A':'R');
}
function v(id){var e=$(id);return e?e.value.trim():''}
function metrics(){
  var cnt=function(arr,p){var d=0;arr.forEach(function(_,i){if(S.tick[p+i])d++});return d};
  var b=cnt(BOH,'B'),fh=cnt(FOH,'F'),y=cnt(SYS,'Y'),au=cnt(AUD,'AU');
  var tot=BOH.length+FOH.length+SYS.length+AUD.length,done=b+fh+y+au;
  var ragTotal=MTX.length;RM.forEach(function(x){ragTotal+=x[1].length});
  var r=0,a=0,g=0,rt=0;for(var k in S.rag){rt++;var x=S.rag[k];if(x==='R')r++;else if(x==='A')a++;else g++}
  var streak=0,best=0,lastIdx=-1;for(var i=0;i<WEEKS;i++)if(weekStatus(i))lastIdx=i;
  for(var j=0;j<=lastIdx;j++){if(weekStatus(j)==='G'){streak++;best=Math.max(best,streak)}else streak=0}
  var openActs=S.acts.filter(function(id){return v('a'+id+'_i')&&v('a'+id+'_r')!=='G'}).length;
  return {b:b,fh:fh,y:y,au:au,tot:tot,done:done,ragTotal:ragTotal,rt:rt,r:r,a:a,g:g,streak:streak,best:best,any:lastIdx>=0,openActs:openActs,pct:Math.round((done+rt)/(tot+ragTotal)*100)};
}
function upd(){
  var M=metrics(),site=v('c_site')||'Untitled site';
  document.title=site+' · Hajime Owari';
  $('hTitle').textContent=site+' Hajime → Owari';
  $('hSub').textContent=[v('c_cluster')||'Cluster TBC',v('c_code')?'Site code '+v('c_code'):'Site code not ruled',v('c_am')?'AM '+v('c_am'):''].filter(Boolean).join(' · ');
  $('sigSite').textContent=site+(v('c_code')?' ('+v('c_code')+')':'');
  $('cB').textContent=M.b+' / '+BOH.length;$('cF').textContent=M.fh+' / '+FOH.length;$('cY').textContent=M.y+' / '+SYS.length;$('cAU').textContent=M.au+' / '+AUD.length;
  $('pbar').style.width=M.pct+'%';$('pctv').textContent=M.pct+'%';
  $('tally').innerHTML='<span class="tag">Hajime items <b>'+M.done+' / '+M.tot+'</b></span><span class="tag">Scored <b>'+M.rt+' / '+M.ragTotal+'</b></span><span class="tag"><i class="dot dR"></i>Red <b>'+M.r+'</b></span><span class="tag"><i class="dot dA"></i>Amber <b>'+M.a+'</b></span><span class="tag"><i class="dot dG"></i>Green <b>'+M.g+'</b></span><span class="tag">Open actions <b>'+M.openActs+'</b></span>';
  for(var i=0;i<WEEKS;i++){var s=weekStatus(i),el=$('w'+i+'_st');el.className='st '+s;el.textContent=s==='G'?'Green':s==='A'?'1 miss':s==='R'?'Red':'No data'}
  var pips='';for(var p=0;p<4;p++)pips+='<i class="'+(p<Math.min(M.streak,4)?'on':'')+'"></i>';$('pips').innerHTML=pips;
  $('streakTxt').innerHTML=!M.any?'No trading weeks logged yet. Enter W1 once the site has a full week of cash-ups.':M.streak>=4?'<b>Four green weeks in a row.</b> Owari can close: book the Kiban sign-off.':'<b>'+M.streak+' of 4</b> consecutive green weeks'+(M.best>M.streak?' (best run '+M.best+')':'')+'.';
  $('strip').innerHTML=MILES.map(function(m){var d=v(m[0]);return '<div class="dt'+(d?'':' none')+'"><b>'+(d?ukDate(d).slice(0,5):'TBC')+'</b><span>'+esc(m[1])+'</span></div>'}).join('');
  return M;
}
function collect(){
  var f={};document.querySelectorAll('#view input[id],#view select[id],#view textarea[id]').forEach(function(e){if(e.value!=='')f[e.id]=e.value});
  var M=metrics();
  return {id:cur,hidden:!!(reports[cur]&&reports[cur].hidden),tick:S.tick,rag:S.rag,dec:S.dec,phase:S.phase,acts:S.acts.slice(),nextAct:S.nextAct,fields:f,savedAt:Date.now(),created:(reports[cur]&&reports[cur].created)||Date.now(),
    meta:{site:v('c_site'),code:v('c_code'),cluster:v('c_cluster'),am:v('c_am'),phase:S.phase,open:v('c_open'),pct:M.pct,r:M.r,a:M.a,g:M.g,streak:M.streak,openActs:M.openActs}};
}
function touch(){if(!cur)return;dirtyAt=Date.now();upd();clearTimeout(saveTimer);setStat('busy','Unsaved changes');saveTimer=setTimeout(save,1200)}
function save(){
  if(!cur)return;if(saving){saveTimer=setTimeout(save,800);return}
  var id=cur,d=collect();reports[id]=d;pending[id]=true;saving=true;setStat('busy','Saving');
  storeSet(id,d).then(function(){lastSaved=d.savedAt;pending[id]=false;setStat('ok','Saved to shared record · '+hhmm(d.savedAt))},
    function(e){pending[id]=true;setStat('busy','Save did not reach the shared record'+(e&&e.error?' ('+e.error+')':'')+' · retrying');if(cur===id){clearTimeout(saveTimer);saveTimer=setTimeout(save,4000)}}).then(function(){saving=false});
}

/* ---------- summary ---------- */
function block(title,items,pfx,g){var o='\n'+title.toUpperCase()+'\n';items.forEach(function(t,i){var k=pfx+i,n=v('n_'+k);o+='  ['+(S.tick[k]?'x':' ')+'] '+(g?t[0]:t)+(n?'  ('+n+')':'')+'\n'});return o}
function buildText(){
  var t='MAKI & RAMEN · HAJIME → OWARI HANDOVER\n';
  t+='Site: '+v('c_site')+'   Code: '+(v('c_code')||'not ruled')+'   Cluster: '+(v('c_cluster')||'TBC')+'   Phase: '+S.phase+'\n';
  t+='Region AM: '+(v('c_am')||'TBC')+'   DAM: '+(v('c_dam')||'TBC')+'   GM (Owari lead): '+(v('c_gm')||'TBC')+'   AGM: '+(v('c_agm')||'TBC')+'\n';
  t+='Hajime lead: '+(v('c_haj')||'TBC')+'   Team: '+['c_h1','c_h2','c_h3','c_h4'].map(v).filter(Boolean).join(', ')+'\n';
  t+='Key dates: '+MILES.map(function(m){return m[1]+' '+(ukDate(v(m[0]))||'TBC')}).join(' · ')+'\n';
  t+=block('1.1 BOH kitchen',BOH,'B')+block('1.2 FOH service',FOH,'F')+block('1.3 Systems',SYS,'Y');
  t+='\n2.0 OPENING SUCCESS MATRIX\n';
  MTX.forEach(function(m,i){var k='MX'+i;t+='  ['+(S.rag[k]||' ')+'] '+m[0]+'\n';m[3].forEach(function(fd,j){var val=v(k+'_'+j);if(val)t+='      '+fd[0]+': '+val.replace(/\n/g,' / ')+'\n'})});
  t+='\n3.0 OWARI WEEKS\n';var anyw=false;
  for(var i=0;i<WEEKS;i++){var s=weekStatus(i);if(!s&&!v('w'+i+'_wc'))continue;anyw=true;t+='  W'+(i+1)+' '+ukDate(v('w'+i+'_wc'))+'  sales '+(v('w'+i+'_sales')||'-')+' / target '+(v('w'+i+'_tgt')||'-')+'  covers '+(v('w'+i+'_cov')||'-')+'  wage '+(v('w'+i+'_wage')||'-')+'%  food '+(v('w'+i+'_food')||'-')+'%  ★ '+(v('w'+i+'_star')||'-')+'  ['+(s||'-')+']\n'}
  if(!anyw)t+='  (no trading weeks logged)\n';
  t+=block('4.1 Audits',AUD,'AU',true)+'\n4.2 ISSUES & ACTIONS\n';
  var al=S.acts.filter(function(id){return v('a'+id+'_i')});if(!al.length)t+='  (none)\n';
  al.forEach(function(id,i){t+='  '+(i+1)+'. ['+v('a'+id+'_r')+'] '+v('a'+id+'_i')+'\n     '+v('a'+id+'_d')+' · owner '+(v('a'+id+'_o')||'TBC')+' · due '+(ukDate(v('a'+id+'_u'))||'TBC')+'\n'});
  t+='\n4.3 READINESS MATRIX\n';var n=0;
  RM.forEach(function(g){t+='  '+g[0]+'\n';g[1].forEach(function(rw){var k='RM'+(n++),nt=v('n_'+k);t+='    ['+(S.rag[k]||' ')+'] '+rw[0]+(nt?'  ('+nt+')':'')+'\n'})});
  t+='\n4.4 SIGN-OFF\n';SIGN.forEach(function(s,i){t+='  '+s+': '+(v('sg_n'+i)||'TBC')+'  initials: '+(v('sg_s'+i)||'-')+'  date: '+(ukDate(v('sg_d'+i))||'-')+'\n'});
  t+='  Decision: '+(S.dec||'not set')+'\n  Risks / watch-items:\n'+(v('f_risks')||'(none)').split('\n').map(function(l){return '    '+l}).join('\n')+'\n';
  var r=[];for(var k in S.rag)if(S.rag[k]==='R'){var el=document.querySelector('.rag button[data-k="'+k+'"]');if(el)r.push(el.closest('.mrow').dataset.label)}
  if(r.length)t+='\nREDS TO CLOSE:\n'+r.map(function(x){return '  - '+x}).join('\n')+'\n';
  return t+'\nMichael Salvador · Chief Operating Officer · Maki & Ramen\n';
}
function copyOut(){
  var t=buildText();
  function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Summary copied')}catch(e){toast('Copy blocked by the browser')}a.remove()}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast('Summary copied')},fb);else fb();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var act=b.dataset.act;
  if(act==='new'){showNew();return}
  if(act==='togglehidden'){window.__showHidden=!window.__showHidden;renderHome();return}
  if(act==='hidetoggle'&&cur&&reports[cur]){reports[cur].hidden=!reports[cur].hidden;b.textContent=reports[cur].hidden?'Show in list':'Hide from list';touch();toast(reports[cur].hidden?'Hidden from the list':'Showing in the list');return}
  if(act==='cancelnew'){$('newSlot').innerHTML='';return}
  if(act==='create'){createReport();return}
  if(act==='copy'){copyOut();return}
  if(act==='print'){try{window.print()}catch(x){toast('Printing is blocked here, use Copy summary')}return}
  if(!cur||!S)return;
  if(act==='addact'){var id=S.nextAct++;S.acts.push(id);$('actions').appendChild(actRow(id));touch();$('a'+id+'_i').focus();return}
  if(act==='delete'){
    if(Date.now()-delArm>4000){delArm=Date.now();b.classList.add('arm');b.textContent='Tap again to delete for everyone';setTimeout(function(){if(b.isConnected){b.classList.remove('arm');b.textContent='Delete this report'}},4000);return}
    var gone=cur;clearTimeout(saveTimer);cur=null;delete reports[gone];storeDel(gone).then(function(){toast('Report deleted')},function(){toast('Delete refused')});location.hash='#/';return}
  if(b.classList.contains('tk')){S.tick[b.dataset.k]=!S.tick[b.dataset.k];if(!S.tick[b.dataset.k])delete S.tick[b.dataset.k];paint();touch()}
  else if(b.closest('.rag')){var k=b.dataset.k;if(S.rag[k]===b.dataset.v)delete S.rag[k];else S.rag[k]=b.dataset.v;paint();touch()}
  else if(b.closest('#dec')){S.dec=S.dec===b.dataset.d?'':b.dataset.d;paint();touch()}
  else if(b.classList.contains('ph')){S.phase=b.dataset.p;paint();touch()}
  else if(b.classList.contains('del')){var row=b.closest('.act'),rid=+row.dataset.id;S.acts=S.acts.filter(function(x){return x!==rid});row.remove();touch()}
});
document.addEventListener('input',function(e){if(cur&&e.target.closest('#view')&&!e.target.closest('.newform'))touch()});
document.addEventListener('change',function(e){
  if(!cur||!e.target.closest('#view'))return;
  if(/^a\d+_r$/.test(e.target.id))e.target.closest('.act').dataset.rag=e.target.value;
  if(e.target.id==='c_cluster'){var c=CLUSTERS[e.target.value];if(c){if(!v('c_am'))$('c_am').value=c.am;if(!v('c_dam'))$('c_dam').value=c.dam}}
  touch();
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.closest&&e.target.closest('.newform')){e.preventDefault();createReport()}});

/* ---------- gate ---------- */
var needCode=false, loaded=false, pending={};
function renderGate(){
  $('barBtns').innerHTML='';
  $('view').innerHTML='<header class="homehead"><div><div class="eyebrow">Area Management · Site Lifecycle</div><h1>Hajime → Owari Reports</h1><div class="sub">Enter the team code to open the shared reports. You only need to do this once on each device.</div></div></header>'+
   '<div class="newform" style="max-width:420px"><label for="gate_code">Team code</label><input id="gate_code" autocomplete="off"><div class="err" id="gate_err"></div><div class="acts"><button type="button" class="btn pri" data-act="unlock">Open reports</button></div></div>';
  setTimeout(function(){var g=$('gate_code');if(g)g.focus()},30);
}
function unlock(){var c=($('gate_code').value||'').trim();if(!c)return;setCode(c);$('gate_err').textContent='Checking…';refresh(true)}

/* ---------- sync ---------- */
var inflight=null;
function refresh(first){
  if(inflight)return inflight;
  inflight=fetchAll().then(function(j){
    if(!j.ok){if(j.error==='bad_code'){needCode=true;online=false;if($('gate_err')&&code())$('gate_err').textContent='That code did not work.';else route();setStat('','Team code needed');return}throw j}
    var wasGate=needCode;needCode=false;online=true;loaded=true;
    var next={};(j.docs||[]).forEach(function(d){next[d.id]=d});
    // keep local edits that never reached the sheet
    var loc=localAll();Object.keys(pending).forEach(function(id){if(pending[id]&&loc[id])next[id]=loc[id]});
    var curRemote=cur&&next[cur];
    reports=next;
    try{localStorage.setItem(LKEY,JSON.stringify(next))}catch(e){}
    Object.keys(pending).forEach(function(id){if(pending[id]&&!saving&&next[id]){storeSet(id,next[id]).then(function(){pending[id]=false},function(){})}});
    if(first||wasGate){route()}
    else if(!cur){if(!($('newSlot')&&$('newSlot').innerHTML))renderHome();setStat('ok','Shared · '+Object.keys(next).length+' reports · synced '+hhmm(Date.now()))}
    else if(!$('hTitle')&&curRemote){openReport(cur)}
    else if(curRemote&&(curRemote.savedAt||0)>lastSaved&&Date.now()-dirtyAt>5000&&!saving&&!pending[cur]){lastSaved=curRemote.savedAt;apply(curRemote);setStat('ok','Updated by a teammate · '+hhmm(curRemote.savedAt))}
    else if(cur&&!saving&&!pending[cur]&&Date.now()-dirtyAt>5000&&/Offline|syncing|Loading/.test($('stat').textContent))setStat('ok','Shared record · synced '+hhmm(Date.now()));
    if(!cur&&!first)return;
    if(!cur)setStat('ok','Shared · '+Object.keys(next).length+' reports');
  }).catch(function(){online=false;if(!loaded){reports=localAll();loaded=true;route()}setStat('','Offline · showing this device’s copy')}).then(function(){inflight=null});
  return inflight;
}

/* ---------- boot ---------- */
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='gate_code'){e.preventDefault();unlock()}});
document.addEventListener('click',function(e){var b=e.target.closest('[data-act="unlock"]');if(b)unlock()});
setStat('busy','Loading shared reports');
if(!code()){needCode=true;renderGate();setStat('','Team code needed')}
else{var cached=localAll();if(Object.keys(cached).length){reports=cached;loaded=true;route();setStat('busy','Showing saved copy · syncing');refresh(false)}else{$('view').innerHTML='<div class="empty">Loading reports…</div>';refresh(true)}}
setInterval(function(){if(!needCode&&document.visibilityState==='visible')refresh(false)},60000);
document.addEventListener('visibilitychange',function(){if(!needCode&&document.visibilityState==='visible')refresh(false)});
})();
</script>

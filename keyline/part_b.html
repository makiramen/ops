const DAYNAME = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtD(d){
  const t=ukNow(); t.setHours(0,0,0,0);
  const diff=Math.round((new Date(d).setHours(0,0,0,0)-t)/864e5);
  const base=DAYNAME[d.getDay()];
  if(diff===0) return base+' (today)';
  if(diff>0 && diff<7) return base;
  return base+' '+d.getDate()+' '+MON[d.getMonth()];
}

function fmtDabs(d){ return DAYNAME[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; }

/* ---------------- route resolution ---------------- */
function routeFor(site, sup){
  if(NO_CUTOFF_SUPPLIERS.includes(sup))
    return {verified:false, note:sup+' has no cut-off time recorded anywhere'};
  if(UNKNOWN_SITES.includes(site))

  const r = ROUTES.find(x=>x.site===site && x.sup===sup);
  if(!r) return {verified:false, note:'No route on file for '+site+' / '+sup};
  return r;
}
const startOfDay = d => {const x=new Date(d); x.setHours(0,0,0,0); return x;};
const addDays = (d,n) => {const x=new Date(d); x.setDate(x.getDate()+n); return x;};
const hhmm = t => {const [h,m]=t.split(':').map(Number); return h+m/60;};

/* Next reachable cut-off and the delivery it buys, plus the one after. */
function nextDeliveries(route, now){
  if(!route || route.verified===false) return null;
  const today = startOfDay(now), hourNow = now.getHours()+now.getMinutes()/60;
  const events = [];
  for(let k=0;k<21;k++){
    const d = addDays(today,k), dow = d.getDay();
    if(route.rolling){
      if(!route.anyDay && (dow===0 || dow===6)) continue;   // business-day cut-offs unless anyDay
      if(k===0 && hourNow >= hhmm(route.rollingTime)) continue;
      let del = addDays(d,1);
      let guard=0;
      while((route.noDeliver||[]).includes(del.getDay()) || del.getDay()===0){
        del = addDays(del,1); if(++guard>7) break;
      }
      events.push({cut:d, cutTime:route.rollingTime, del, cutDow:dow});
    } else {
      for(const c of route.cutoffs){
        if(c.day!==dow) continue;
        if(k===0 && hourNow >= hhmm(c.time)) continue;
        let ahead = (c.dev - dow + 7) % 7; if(ahead===0) ahead = 7;
        events.push({cut:d, cutTime:c.time, del:addDays(d,ahead), cutDow:dow});
      }
    }
    if(events.length>=6) break;
  }
  events.sort((a,b)=> a.cut-b.cut || hhmm(a.cutTime)-hhmm(b.cutTime));
  if(!events.length) return null;
  const now1 = events[0];
  const skip = events.find(e=> startOfDay(e.del) > startOfDay(now1.del)) || null;   // next delivery strictly later than the one we can still catch
  const dd = t => Math.round((startOfDay(t)-startOfDay(now))/864e5);
  return {
    next: now1, skip,
    Rnow:  dd(now1.del),
    Rskip: skip ? dd(skip.del) : dd(now1.del)+7,
    cutIsToday: dd(now1.cut)===0,
    hoursToCut: (startOfDay(now1.cut)/1 + hhmm(now1.cutTime)*36e5 - now)/36e5
  };
}

/* ---------------- trading period and the Baseline ----------------
   Michael, 08/09/2026: no min bottom line, no max bottom line. One BASELINE per site and line: the permanent
   stock holding that must be in store, built from the 8-month average usage and the delivery route.
   Baseline = usage x (longest routine gap to the delivery after next on this route + item buffer), rounded UP.
   It does not move with the day of the week. Weeks 1 and 2 of the 4-week trading period: hold the Baseline,
   Order = Baseline - stock. Weeks 3 and 4: the reserve is open, sites may run into the Baseline down to the
   run-out floor (usage x days to the delivery after next + buffer, the old daily bottom line), Order = floor - stock.
   The Baseline is topped back up from week 1 of the next period, not before. */
const PERIOD_ANCHOR = new Date(2026, 7, 31);   // Monday 31/08/2026 = week 1 of a 4-week trading period. Change here only.
function periodWeek(now){
  const d = Math.floor((startOfDay(now) - startOfDay(PERIOD_ANCHOR)) / 864e5);
  const w = Math.floor(d / 7);
  return ((w % 4) + 4) % 4 + 1;              // 1..4
}
function periodInfo(now){
  const wk = periodWeek(now);
  const dow = (startOfDay(now).getDay() + 6) % 7;                 // Monday = 0
  const monday = addDays(startOfDay(now), -dow);
  const reserveOpen = wk >= 3;
  const nextChange = addDays(monday, reserveOpen ? (5 - wk) * 7 : (3 - wk) * 7);   // Monday the mode flips
  return {week: wk, monday, reserveOpen, nextChange};
}
const _BLD = {};
/* Longest routine gap to the delivery after next on this route, probed at 09:00 on each of the next 7 days. */
function baselineDays(route, B){
  if(!route || route.verified===false) return null;
  const key = JSON.stringify([route.cutoffs||null, route.rolling||null, route.rollingTime||null, route.anyDay||null, route.noDeliver||null]);
  if(_BLD[key]==null){
    let worst = 0;
    for(let k=0;k<7;k++){
      const probe = addDays(startOfDay(NOW_FOR_BASELINE()), k); probe.setHours(9,0,0,0);
      const d = nextDeliveries(route, probe);
      if(d && d.Rskip > worst) worst = d.Rskip;
    }
    _BLD[key] = worst || null;
  }
  return _BLD[key]!=null ? _BLD[key] + B : null;
}
// The engine runs on UK wall clock whatever the viewer's zone (Michael views from Dubai, +3h): Kobas

function ukNow(){ try{ const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date()); const g=t=>+p.find(x=>x.type===t).value; return new Date(g('year'),g('month')-1,g('day'),g('hour')%24,g('minute'),g('second')); }catch(e){ return new Date(); } }

const USAGE8M_META = {"from":"2026-01-01","to":"2026-08-16","pulled":"2026-09-07","firstTradingDay":{"M17":"2026-02-06","M18":"2026-03-06","M19":"2026-06-27","M20":"2026-07-03"},"source":"Kobas Stock Ingredient Movements, one report per site per two-month block (Jan-Feb, Mar-Apr, May-Jun, Jul to 16 Aug); Units Used x measure per unit summed across pack rows, divided by the keyline pack; trading days = days with sales > 0 in Mona Lisa"};

/* ---------------- the status engine ---------------- */
function evaluate(line, now){
  const item = ITEMS.find(i=>i.id===line.item);
  const sup  = SUPPLIER_OVERRIDE[line.site+'|'+line.item] || SUPPLIER_OF[line.item];
  const route= routeFor(line.site, sup);
  const del  = nextDeliveries(route, now);
  const B    = (line.bufferOverride!=null) ? line.bufferOverride : item.buffer;
  /* Days left: stock / 8-month average daily usage where the site has history (USAGE8M),
     otherwise the days remaining Kobas reports. Kobas's own figure is kept as coverKobas. */
  const hist = (USAGE8M[line.site]||{})[line.item];
  const Dk   = line.cover;
  const D    = (hist>0 && line.stock!=null && line.stock>=0) ? line.stock/hist : Dk;
  const site = window.KEYLINE_DATA.siteMeta[line.site] || {};
  const out  = {...line, item, sup, route, del, B, cover:D, coverKobas:Dk, usageHist:(hist>0?hist:null), stale:!!site.stale, assumed:!!(route&&route.assumed)};

  if(line.stock < 0 || line.negative){
    out.status='CHECK';
    out.why='Kobas shows '+fmtQty(line.stock,item)+'. You cannot hold negative stock. Count it physically, then tell Ross if the count and Kobas still disagree.';
    return out;
  }
  if(UNMAPPED.includes(line.item)){
    out.status='CHECK'; out.why='This line is not mapped to a supplier tab at any site. Ross to confirm the SKU before it can be ordered.'; return out;
  }
  if(line.note && line.stock>=0 && D<=90){ out.noteExtra=line.note; }
  if(line.missing){ out.status='DATA'; out.why='Not returned by the Kobas report for this site.'; return out; }
  if(D > 90){ out.status='DATA'; out.why=Math.round(D)+' days of stock is not credible. Usage or unit of measure is wrong, not the stock.'; return out; }

  if(!del){
    out.status='ROUTE';
    out.why=(route.note||'Supplier route unverified')+'. '+fmtDays(D)+' left. Nothing is instructed until the cut-off is confirmed.';
    out.provisional=true;
    out.provStatus = D < 3 ? 'would be URGENT' : (D < 7 ? 'would be ORDER TODAY' : 'looks fine');
    return out;
  }

  const threshold = del.Rskip + B;
  out.threshold = threshold; out.Rnow = del.Rnow; out.Rskip = del.Rskip;
  /* Usage is the 8-month Kobas average (USAGE8M, 1 Jan to 16 Aug 2026). Where a site has no history it falls
     back to the usage Kobas implies from the current position (stock / days remaining). */
  const usage = (hist>0) ? hist : ((line.stock > 0 && Dk > 0) ? line.stock / Dk : null);
  out.usage = usage; out.usageSource = (hist>0) ? '8-month average' : 'implied from the Kobas position';
  /* Baseline: permanent holding, fixed per site and line. Floor: the run-out level for today's route position. */
  const per = periodInfo(now);
  const bDays = baselineDays(route, B);
  out.period = per; out.baselineDays = bDays;
  const parLvl = parFor(line.site, line.item);
  out.par = parLvl;
  out.baseline = (parLvl!=null) ? parLvl
               : ((usage!=null && bDays!=null) ? Math.ceil(usage * bDays - 1e-9) : null);
  out.baselineSource = (parLvl!=null) ? 'PAR sheet' : 'computed';
  out.floor    = usage!=null ? Math.ceil(usage * threshold - 1e-9) : null;
  out.required = per.reserveOpen ? out.floor : out.baseline;
  /* Clarity figures (Michael, 09/09/2026): what is on the shelf, what the usage says is left, what will be
     left the day the next possible delivery lands, and how that sits against the Baseline / PAR. */
  out.runOut     = (D!=null && isFinite(D)) ? addDays(now, Math.floor(D)) : null;
  out.atDelivery = (usage!=null && del) ? (line.stock - usage * del.Rnow) : null;   // stock on the delivery day
  out.vsBaseline = (out.baseline!=null) ? (line.stock - out.baseline) : null;
  out.pctBaseline= (out.baseline>0) ? (line.stock / out.baseline) : null;
  out.bottomLine = out.baseline;   // legacy name kept for render.py and the mail builder
  const stockWhole = Math.floor(line.stock);
  out.orderQty = out.required!=null ? Math.max(0, out.required - stockWhole) : null;
  const short = out.required!=null && stockWhole < out.required;
  out.belowFloor = out.floor!=null && stockWhole < out.floor;   // real run-out risk, not just a Baseline top-up
  const modeTxt = per.reserveOpen
    ? 'Week '+per.week+' of 4, reserve open: order only to the run-out floor of '+(out.floor!=null? fmtQty(out.floor,item):'?')+', the Baseline of '+(out.baseline!=null? fmtQty(out.baseline,item):'?')+' is restored from '+fmtDabs(per.nextChange)+'.'
    : 'Week '+per.week+' of 4: hold the Baseline of '+(out.baseline!=null? fmtQty(out.baseline,item):'?')+'.';

  if(D < del.Rnow){
    out.status='URGENT';
    out.why=fmtDays(D)+' left. The earliest possible delivery is '+fmtD(del.next.del)+', '+del.Rnow+' days away, so routine ordering will not reach you in time. Order at the next cut-off ('+fmtD(del.next.cut)+' '+del.next.cutTime+') AND contact your AM now to arrange a transfer, approved local sourcing or menu mitigation.';
  } else if(del.cutIsToday && short){
    out.status='ORDER';
    out.why=fmtQty(line.stock,item)+' in stock, '+fmtDays(D)+' left. '+modeTxt+' Order '+fmtQty(out.orderQty,item)+' by '+del.next.cutTime+' today for delivery '+fmtD(del.next.del)+'; miss it and the next is '+del.Rskip+' days out.';
  } else if(short){
    out.status='WATCH';
    out.why=fmtQty(line.stock,item)+' in stock, '+fmtDays(D)+' left. '+modeTxt+' You do not need to order today. Order '+fmtQty(out.orderQty,item)+' by '+fmtD(del.next.cut)+' '+del.next.cutTime+' for delivery '+fmtD(del.next.del)+'.';
  } else if(D > 21 && out.baseline!=null && stockWhole > out.baseline){
    out.status='OVER';
    out.why=Math.round(D)+' days of stock, '+fmtQty(line.stock - out.baseline,item)+' above the Baseline. Stop ordering and propose a transfer to a tighter site.';
  } else {
    out.status='OK';
    out.why=fmtQty(line.stock,item)+' in stock, '+fmtDays(D)+' left. '+modeTxt;
  }
  if(out.noteExtra) out.why += ' ' + out.noteExtra;
  return out;
}

function fmtDays(d){ return (d<10 ? d.toFixed(1) : Math.round(d)) + ' days'; }
function fmtQty(v,item){
  if(v==null) return '-';
  const u = item.unit==='kg' ? 'kg' : (item.unit==='pack' ? (Math.abs(v)===1?'pack':'packs') : (Math.abs(v)===1?'case':'cases'));
  return (Math.round(v*10)/10) + ' ' + u;
}
const RANK = {URGENT:0, ORDER:1, WATCH:2, CHECK:3, ROUTE:4, DATA:5, OVER:6, OK:7};
const LABEL = {URGENT:'Urgent', ORDER:'Order today', WATCH:'Watch', CHECK:'Physical check',
               ROUTE:'Route unverified', DATA:'Data check', OVER:'Overstocked', OK:'OK'};
</script>

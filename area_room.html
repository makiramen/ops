<!doctype html>
<!-- area-room-built: 2026-11-24 daily:2026-11-23 reviews:2026-11-23 weeks:2026-11-16 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AM Control Centre</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --maki-orange:#E94E1B;--maki-orange-soft:#F47C24;--maki-orange-bg:#FFF1EA;--maki-orange-ring:#E94E1B33;
  --maki-ink:#1A1410;--maki-cream:#FFF8F0;
  --bg:#f4f5f9;--surface:#fff;--surface-2:#fafbfd;--ink:#0f172a;--ink-2:#475569;--ink-3:#94a3b8;--line:#e2e8f0;
  --red:#dc2626;--red-bg:#fef2f2;--amber:#d97706;--amber-bg:#fffbeb;--green:#059669;--green-bg:#ecfdf5;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 12px rgba(15,23,42,.06);
  --shadow-lg:0 4px 24px rgba(15,23,42,.08),0 16px 40px rgba(15,23,42,.12);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:24px}

/* header: copy of the AM Control Centre header */
.maki-brand-bar{background:var(--maki-cream);border-bottom:2px solid var(--maki-orange);padding:14px 32px;display:flex;align-items:center;gap:18px;box-shadow:0 1px 0 rgba(233,78,27,.06)}
.maki-logo{height:48px;width:auto;display:block;flex-shrink:0}
.maki-brand-title{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.maki-brand-name{font-size:14px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--maki-ink);line-height:1}
.maki-brand-name .dot{color:var(--maki-orange);margin:0 8px}
.maki-brand-sub{font-size:13px;font-weight:600;color:var(--maki-orange);line-height:1.2}
.maki-brand-kanji{font-family:"Noto Sans JP","Plus Jakarta Sans",sans-serif;font-size:13px;font-weight:700;color:var(--maki-orange);letter-spacing:.04em;white-space:nowrap;cursor:default;user-select:none;-webkit-user-select:none;transition:text-shadow .3s}
.maki-brand-kanji:hover{text-shadow:0 0 1px rgba(233,78,27,.25)}
.maki-brand-chip{background:var(--maki-orange-bg);border:1px solid var(--maki-orange-ring);color:var(--maki-orange);padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.week-toggle-bar{display:flex;align-items:center;gap:8px}
.week-toggle-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.week-select{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
@media(max-width:720px){.maki-brand-bar{padding:10px 16px;gap:12px;flex-wrap:wrap}.maki-logo{height:38px}.week-toggle-bar{width:100%}}

.shell-note{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:28px;color:var(--ink-3);text-align:center;font-size:13px}

/* ============ GATE ============ */
#gate{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% 40%,rgba(233,78,27,.28),rgba(26,20,16,.92) 60%),#1A1410;padding:16px}
#gate.open{display:flex;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.gate-card{width:100%;max-width:420px;background:#1f1813;border:1px solid rgba(233,78,27,.35);border-radius:20px;padding:34px 28px 26px;color:#fff;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5);position:relative;overflow:hidden}
.gate-card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--maki-orange),var(--maki-orange-soft))}
.torii{font-family:"Noto Sans JP",sans-serif;font-weight:900;font-size:64px;line-height:1;color:var(--maki-orange);text-shadow:0 0 30px rgba(233,78,27,.55);margin-bottom:6px}
.gate-title{font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#f8e9df}
.gate-sub{font-size:12.5px;color:#b9a99c;margin:6px 0 22px}
.gate-input{width:100%;font:inherit;font-size:16px;text-align:center;letter-spacing:.2em;padding:13px 14px;border-radius:12px;border:1px solid #4a3a2f;background:#14100c;color:#fff;outline:none}
.gate-input:focus{border-color:var(--maki-orange);box-shadow:0 0 0 3px rgba(233,78,27,.25)}
.gate-btn{margin-top:12px;width:100%;font:inherit;font-weight:800;font-size:14px;letter-spacing:.06em;padding:12px;border:0;border-radius:12px;background:var(--maki-orange);color:#fff;cursor:pointer}
.gate-btn:hover{background:#d4430f}
.gate-err{min-height:18px;font-size:12px;color:#fca5a5;margin-top:10px}
.gate-close{position:absolute;top:10px;right:12px;background:none;border:0;color:#8c7b6e;font-size:22px;cursor:pointer;line-height:1}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.regions{display:grid;gap:12px;margin-top:4px}
.region-btn{display:block;width:100%;text-align:left;font:inherit;color:#fff;background:#14100c;border:1px solid #4a3a2f;border-radius:14px;padding:16px 18px;cursor:pointer;transition:all .15s}
.region-btn:hover{border-color:var(--maki-orange);background:#22180f;transform:translateY(-1px)}
.region-btn b{display:block;font-size:20px;font-weight:800}
.region-btn span{font-size:12.5px;color:#b9a99c}
.region-btn i{font-style:normal;font-family:"Noto Sans JP",sans-serif;color:var(--maki-orange);float:right;font-weight:900;font-size:22px;margin-top:2px}

/* ============ AREA ROOM ============ */
#room{position:fixed;inset:0;z-index:150;background:var(--bg);overflow:auto;display:none}
#room.open{display:block;animation:fadeIn .3s ease}
.room-bar{position:sticky;top:0;z-index:20;background:#1A1410;color:#fff;border-bottom:3px solid var(--maki-orange);padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.room-mark{font-family:"Noto Sans JP",sans-serif;font-weight:900;font-size:24px;color:var(--maki-orange)}
.room-title{font-weight:800;font-size:16px;letter-spacing:.02em}
.room-title small{display:block;font-size:11.5px;font-weight:500;color:#b9a99c;letter-spacing:0}
.seg{display:inline-flex;background:#2a211b;border-radius:10px;padding:3px;margin-left:auto}
.seg button{font:inherit;font-size:12.5px;font-weight:700;color:#d6c7bb;background:none;border:0;padding:7px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--maki-orange);color:#fff}
.room-x{background:none;border:1px solid #4a3a2f;color:#d6c7bb;border-radius:9px;padding:6px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.room-x:hover{border-color:var(--maki-orange);color:#fff}
.room-wrap{max-width:1280px;margin:0 auto;padding:20px 24px 60px}
.tabbar{display:flex;flex-wrap:wrap;gap:4px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:12px;padding:7px;margin-bottom:18px;box-shadow:var(--shadow)}
.tabbar::-webkit-scrollbar{display:none}
.tabbtn{flex:none;border:0;background:transparent;color:var(--ink-2);font-weight:600;font-size:13px;padding:8px 14px;border-radius:9px;cursor:pointer;font-family:inherit;white-space:nowrap}
.tabbtn:hover{background:var(--surface-2);color:var(--ink)}
.tabbtn.active{background:var(--maki-orange-bg);color:var(--maki-orange)}
.pane{display:none}.pane.on{display:block}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:15.5px;font-weight:800}
.card .sub{font-size:12px;color:var(--ink-3);margin-bottom:12px}
.grid-sites{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.site-tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);border-top:3px solid var(--maki-orange)}
.site-tile h3{margin:0;font-size:15px;font-weight:800}
.site-tile .lead{font-size:11.5px;color:var(--ink-3);margin-bottom:8px}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;border-bottom:1px dashed #eef1f5}
.kv:last-child{border:0}
.kv span{color:var(--ink-2)}.kv b{font-weight:700}

.tblwrap{overflow-x:auto;margin:0 -4px}
table.t{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
table.t th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);background:#f6f2ec;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th.c,table.t td.c{text-align:center}
table.t td{padding:8px 10px;border-bottom:1px solid #eef1f5;vertical-align:middle}
table.t tr.grp td{background:#fcfaf7;font-weight:800;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--maki-orange);padding-top:10px}
table.t td.m{font-weight:600}
table.t th.now{background:var(--maki-orange-bg);color:var(--maki-orange)}
table.t td.now{background:#fffaf6}
.cell{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.g{background:var(--green)}.dot.r{background:var(--red)}.dot.a{background:var(--amber)}.dot.n{background:#cbd5e1}
.na{color:var(--ink-3);font-size:11.5px;font-weight:600}
.fut{color:#cbd5e1;font-weight:700}
.sch{color:var(--ink-3);font-style:italic;font-weight:600;font-size:12px}
.arr{font-size:11px;font-weight:800}
.arr.g{color:var(--green)}.arr.r{color:var(--red)}.arr.n{color:var(--ink-3)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-g{background:var(--green-bg);color:var(--green)}.p-a{background:var(--amber-bg);color:var(--amber)}.p-r{background:var(--red-bg);color:var(--red)}.p-n{background:#f1f5f9;color:#64748b}.p-o{background:var(--maki-orange-bg);color:var(--maki-orange)}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--maki-orange-bg);border:1px solid var(--maki-orange-ring);color:#7c2d12;border-radius:12px;padding:12px 14px;font-size:12.5px;margin-bottom:14px}
.banner b{color:var(--maki-orange)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin:8px 0 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.chk{font-size:12px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.row2{grid-template-columns:1fr}}
.bar{height:8px;border-radius:5px;background:#eef1f5;overflow:hidden}
.bar i{display:block;height:100%;background:var(--maki-orange);border-radius:5px}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.person{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);position:relative}
.person .av{width:40px;height:40px;border-radius:12px;background:var(--maki-orange);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px;float:left;margin-right:12px}
.person h3{margin:0;font-size:15px;font-weight:800}
.person .role{font-size:12px;color:var(--ink-3);margin-bottom:12px}
.person .today{clear:both;background:#fcfaf7;border-radius:10px;padding:10px 12px;font-size:13px}
.person .today b{color:var(--maki-orange)}
.person ul{margin:10px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-2)}
.person li{margin:3px 0}
.timeline{list-style:none;margin:0;padding:0}
.timeline li .pill{align-self:flex-start}
.timeline li{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed #eef1f5;font-size:13px}
.timeline li:last-child{border:0}
.timeline .when{flex:none;width:92px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}
.timeline li.past{opacity:.45}
.timeline li.next .when{color:var(--maki-orange)}
.muted{color:var(--ink-3);font-size:12px}
.foot{font-size:11.5px;color:var(--ink-3);margin-top:20px;text-align:center}
@media(max-width:720px){.room-bar{padding:10px 16px}.room-wrap{padding:14px 16px 50px}.seg{margin-left:0}}

/* site daily sheet */
#sheet{position:fixed;inset:0;z-index:180;display:none;background:rgba(15,10,6,.45)}
#sheet.open{display:block;animation:fadeIn .2s ease}
.sheet-panel{position:absolute;top:0;right:0;bottom:0;width:min(860px,100%);background:var(--bg);overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.25);animation:slideIn .25s ease}
@keyframes slideIn{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{position:sticky;top:0;z-index:5;background:#1A1410;color:#fff;border-bottom:3px solid var(--maki-orange);padding:14px 20px;display:flex;align-items:center;gap:12px}
.sheet-head h2{margin:0;font-size:18px;font-weight:800}
.sheet-head small{display:block;color:#b9a99c;font-size:12px;font-weight:500}
.sheet-body{padding:18px 20px 50px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi span{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.kpi b{display:flex;align-items:center;gap:7px;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi small{color:var(--ink-3);font-size:11.5px}
.rv{border-bottom:1px dashed #eef1f5;padding:9px 0;font-size:13px}
.rv:last-child{border:0}
.rv .st{font-weight:800;color:var(--maki-orange);margin-right:6px;letter-spacing:1px}
.rv.bad .st{color:var(--red)}
.rv .who{color:var(--ink-3);font-size:11.5px}
[data-site]{cursor:pointer}
.site-tile[data-site]:hover{border-color:var(--maki-orange);transform:translateY(-1px);transition:.15s}
td.sitecell[data-site]:hover{color:var(--maki-orange);text-decoration:underline}
.negbtn{font:inherit;font-size:11.5px;font-weight:700;color:var(--red);background:var(--red-bg);border:1px solid #fecaca;border-radius:999px;padding:2px 9px;cursor:pointer;margin-left:4px}
.negbtn:hover{background:var(--red);color:#fff}
.tap{font-size:11px;color:var(--maki-orange);font-weight:700;margin-top:6px}
/* ===== AM Control Centre colours (08/10/2026): cream bar, orange table heads, orange bands, gradient heroes ===== */
:root{--amber-ring:#fde68a;--red-ring:#fecaca;--green-ring:#a7f3d0;--band:#E94E1B}
.room-bar,.sheet-head{background:var(--maki-cream);color:var(--maki-ink);border-bottom:2px solid var(--maki-orange);box-shadow:0 1px 0 rgba(233,78,27,.06)}
.room-logo{height:40px;width:auto;display:block;flex:none}
.room-title{color:var(--maki-ink)}.room-title small{color:var(--maki-orange);font-weight:600}
.sheet-head h2{color:var(--maki-ink)}.sheet-head small{color:var(--maki-orange);font-weight:600}
.room-x{background:var(--maki-orange-bg);border:1px solid var(--maki-orange-ring);color:var(--maki-orange)}
.room-x:hover{background:var(--maki-orange);border-color:var(--maki-orange);color:#fff}
table.t th{background:var(--band);color:#fff;border-bottom:0;letter-spacing:.04em}
table.t th span{color:rgba(255,255,255,.85)!important}
table.t th.now{background:#B5470B;color:#fff}
table.t tr.grp td{background:#FDEEE8;border-top:2px solid var(--band);border-bottom:1px solid #F6C9B6;color:var(--band)}
.site-tile{border-top:0;border-left:4px solid var(--maki-orange)}
.mini-hero{background:linear-gradient(135deg,#7a1f08 0%,#c63d12 55%,#E94E1B 100%);border-radius:18px;color:#fff;padding:20px 24px;margin-bottom:16px;box-shadow:var(--shadow-lg)}
.mini-hero h2{margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.02em;color:#fff}
.mini-hero p{margin:0;color:#fde3d6;font-size:13px}
/* RAG cells, same tokens as the AM CC Deliveroo RAG */
.rg{background:var(--green-bg);color:var(--green)}.ra{background:var(--amber-bg);color:var(--amber)}.rr{background:var(--red-bg);color:var(--red)}.rm{background:#f4f6f8;color:#94a3b8}
table.t td.rg,table.t td.ra,table.t td.rr,table.t td.rm{font-weight:700;font-variant-numeric:tabular-nums}
.ragpill{display:inline-block;min-width:56px;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;text-align:center}
.ragpill.g{background:var(--green-bg);color:var(--green);border:1px solid var(--green-ring)}.ragpill.a{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-ring)}.ragpill.r{background:var(--red-bg);color:var(--red);border:1px solid var(--red-ring)}.ragpill.m{background:#f1f5f9;color:#64748b;border:1px solid var(--line)}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;margin-bottom:16px}
.pcard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--maki-orange);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px}
.pcard.r{border-left-color:var(--red)}.pcard.a{border-left-color:var(--amber)}.pcard.g{border-left-color:var(--green)}
.pcard h3{margin:0;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.pcard .role{font-size:11.5px;color:var(--ink-3);margin:2px 0 10px}
.pcard table.t{min-width:0;font-size:12.5px}
.pcard table.t td,.pcard table.t th{padding:6px 7px}
.wkpick{font:inherit;font-size:12.5px;font-weight:700;padding:6px 10px;border:1px solid var(--maki-orange-ring);border-radius:9px;background:var(--maki-orange-bg);color:var(--maki-orange)}
table.t tr.band td{background:#FDEEE8;border-top:2px solid var(--band);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--band);padding:8px 10px}
table.t tr.tot td{font-weight:800}
/* Deliveroo panel, AM Control Centre style (09/10/2026) */
.roo-panel{padding:4px 0 14px;text-align:left}
.roo-panel+.roo-panel{border-top:1px solid var(--line);padding-top:14px}
.roo-panel h4{margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--ink)}
.roo-panel table.roo-full{border-collapse:collapse;font-size:12px;width:100%;min-width:760px;table-layout:fixed}
.roo-panel col.c-lab{width:19%}.roo-panel col.c-m{width:8.1%}
.roo-panel th,.roo-panel td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.roo-panel th:first-child,.roo-panel td:first-child{text-align:left}
.roo-panel th{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-3);background:transparent;font-weight:700}
.roo-panel tr.sel td:first-child{background:#fff4ee;font-weight:700}.roo-panel tr.sel td{font-weight:700}
.roo-panel td .sub2{display:block;font-size:10px;font-weight:600}.roo-panel .sub2.up{color:var(--green)}.roo-panel .sub2.dn{color:var(--red)}
.roo-panel tr.roo-band td{background:transparent;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--band,#E94E1B);padding-top:12px;border-bottom:2px solid var(--band,#E94E1B);text-align:left}
.roo-panel tr.roo-tot td{font-weight:800;border-top:2px solid var(--line)}
.roo-panel td.roo-wk{font-size:9.5px;font-weight:600;color:#b8bfc9;letter-spacing:.3px}
</style>
</head>

<script>
(function(){
"use strict";
var BLOB=JSON.parse(document.getElementById("payload").textContent);
var D=null, REGION="South", SHOW_RUNIN=false;
var $=function(id){return document.getElementById(id)};
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function same(a,b){if(a.length!==b.length)return false;var ok=true;for(var i=0;i<a.length;i++)if(a[i]!==b[i])ok=false;return ok}
function unlock(name,pw){
  return new Promise(function(res,rej){setTimeout(function(){
    try{
      var U=BLOB.u&&BLOB.u[name];if(!U)return rej(new Error("bad"));
      var ku=PC.pbkdf2(new TextEncoder().encode(pw),b64(U.s),BLOB.n,64),ui=b64(U.i),wk=b64(U.k);
      var wm=new Uint8Array(ui.length+wk.length);wm.set(ui);wm.set(wk,ui.length);
      if(!same(PC.hmac(ku.subarray(32),wm),b64(U.t)))return rej(new Error("bad"));
      var km=PC.ctr(ku.subarray(0,32),ui,wk),iv=b64(BLOB.i),ct=b64(BLOB.c),tag=b64(BLOB.t);
      var m=new Uint8Array(iv.length+ct.length);m.set(iv);m.set(ct,iv.length);
      var calc=PC.hmac(km.subarray(32),m),ok=calc.length===tag.length;
      for(var i=0;i<tag.length;i++)if(calc[i]!==tag[i])ok=false;
      if(!ok)return rej(new Error("bad"));
      res(JSON.parse(new TextDecoder().decode(PC.ctr(km.subarray(0,32),iv,ct))));
    }catch(e){rej(e)}
  },30)});
}
function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){return null}}

/* ---------- logins + usage log (Area Room log sheet, Michael only) ---------- */
var LOG_URL="https://script.google.com/macros/s/AKfycbyVrmiIOv3loHNtR-s6c_d5tfJKe8HXWfy29XdvKt3iz_uWJzK2Ul_89q9BMFYbWu2B/exec";
function logUse(name,kind){
  if(!LOG_URL||LOG_URL.indexOf("http")!==0)return;
  try{fetch(LOG_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},keepalive:true,
    body:JSON.stringify({name:name,kind:kind,at:new Date().toISOString(),w:screen.width,ua:navigator.userAgent.slice(0,160)})}).catch(function(){})}catch(e){}
}
Object.keys(BLOB.u||{}).forEach(function(n){var o=document.createElement("option");o.value=n;o.textContent=n;$("guser").appendChild(o)});

/* ---------- gate wiring ---------- */
var clicks=0,timer=null;
$("kanji").addEventListener("click",function(){
  openGate();
});
function openGate(){
  $("gate").classList.add("open");
  var saved=ss("ar_pw"),su=ss("ar_u");
  if(saved&&su&&!D){$("guser").value=su;tryPw(saved,true);return}
  if(D){showRegions();return}
  $("step-pass").style.display="";
  setTimeout(function(){($("guser").value?$("gpass"):$("guser")).focus()},50);
}
function closeGate(){$("gate").classList.remove("open");$("gerr").textContent="";$("gpass").value=""}
$("gclose").onclick=closeGate;
$("gate").addEventListener("click",function(e){if(e.target===$("gate"))closeGate()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if($("room").classList.contains("open"))return;closeGate()}});
$("gbtn").addEventListener("click",function(){tryPw($("gpass").value,false)});
$("gpass").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();tryPw($("gpass").value,false)}});
function tryPw(pw,silent){
  var who=$("guser").value;
  if(!who){$("gerr").textContent="Pick your name first.";$("guser").focus();return}
  if(!pw)return;
  $("gerr").textContent="Opening…";
  unlock(who,pw.trim().toLowerCase()).then(function(data){
    D=data;ss("ar_pw",pw.trim().toLowerCase());ss("ar_u",who);logUse(who,silent?"reopened":"logged in");showRegions();
  }).catch(function(){
    ss("ar_pw",null);if(!silent)logUse(who,"wrong password");
    if(!silent){$("gerr").textContent="That is not the word.";var c=$("gcard");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");$("gpass").select()}
    else{$("step-pass").style.display="";$("gpass").focus()}
  });
}
function showRegions(){closeGate();openRoom()}
Array.prototype.forEach.call(document.querySelectorAll(".region-btn"),function(b){b.onclick=function(){REGION=b.dataset.r;closeGate();openRoom()}});
Array.prototype.forEach.call(document.querySelectorAll("#rseg button"),function(b){b.onclick=function(){REGION=b.dataset.r;render()}});
$("rlock").onclick=function(){$("room").classList.remove("open");document.body.style.overflow="";ss("ar_pw",null);ss("ar_u",null);D=null};
if(location.hash==="#enter")setTimeout(openGate,0);

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(v,dp){if(v==null||v==="")return null;return Number(v).toLocaleString("en-GB",{minimumFractionDigits:dp||0,maximumFractionDigits:dp||0})}
function dd(iso){var p=iso.split("-");return p[2]+"/"+p[1]}
function sitesIn(r,incSupport){var out=[];for(var c in D.sites_meta){var m=D.sites_meta[c];if(incSupport||!m.support)out.push(c)}return out}
function todayISO(){return D.today}
function curPeriod(){var t=todayISO();for(var i=0;i<D.periods.length;i++){var p=D.periods[i];if(t>=p[2]&&t<=p[3])return p[0]}return null}
function weekData(code,pkey){
  var p=D.periods.filter(function(x){return x[0]===pkey})[0];if(!p)return null;
  var w=D.sites.by_week[p[2]];return w?(w[code]||null):undefined;
}
function runinWeeks(){return D.sites.weeks_available.filter(function(w){return w<"2026-09-28"})}
function cell(v,ok,unit,dp){
  if(v===undefined)return '<span class="fut">·</span>';
  if(v==null)return '<span class="na">n/a</span>';
  var cls=ok==null?"n":(ok===true?"g":(ok===false?"r":ok));
  return '<span class="cell"><span class="dot '+cls+'"></span>'+fmt(v,dp)+(unit||"")+'</span>';
}
function headCols(first){
  var cur=curPeriod(),h='<tr><th>'+first+'</th><th>Site</th><th class="c">Target</th>';
  if(SHOW_RUNIN)runinWeeks().forEach(function(w){h+='<th class="c">w/c '+dd(w)+'</th>'});
  D.periods.forEach(function(p){h+='<th class="c'+(p[0]===cur?' now':'')+'">'+p[1]+'<br><span style="font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink-3)">'+dd(p[2])+'</span></th>'});
  return h+'</tr>';
}

/* ---------- RAG bands (08/10/2026). Green hits the plan target, amber is close, red is a miss or a Red Light ---------- */
var OWN=[
  {who:"Lincoln",role:"Area Manager · Lakeside, Southampton, Shoreditch",sites:["M17","M20","M19"]},
  {who:"Kaitlin",role:"Deputy Area Manager · Soho, Maki Nori, Shoreditch",sites:["M18","MakiNori","M19"]},
  {who:"Kei",role:"Acting GM Lakeside · B2B for the region",sites:["M17"],b2b:true}
];
function share(v,t){return v==null||t==null?null:(v>=t?"g":(v>=0.75*t?"a":"r"))}
function rLab(v,c){var t=D.targets[c]&&D.targets[c].labour;return v==null||t==null?null:(v<=t?"g":(v<=t+2?"a":"r"))}
function rSales(v){return v==null?null:(v>=0?"g":(v>-10?"a":"r"))}
function rFood(v){return v==null?null:(v<24?"g":(v<=25?"a":"r"))}
function rStar(v){return v==null?null:(v>=4.7?"g":(v>=4.5?"a":"r"))}
function rComp(v){return v==null?null:(v>=95?"g":(v>=90?"a":"r"))}
function rClean(v){return v==null?null:(v>=3?"g":"r")}
function rEff(v){return v==null?null:(v>=90?"g":(v>=85?"a":"r"))}
/* Deliveroo weekly: the AM CC canonical 5 metric bands. Rider wait blank = 0. RED if any red, GREEN if all green, else AMBER */
var DM=[["d_rating","Rating",4.7,4.0,true,2,""],["d_open","Open",98,95,true,1,"%"],["d_prep","Prep",15,18,false,1," min"],["d_inacc","Inaccurate",2,3,false,1,"%"],["d_rider","Rider wait",2,4,false,1,"%"]];
function band(v,g,a,up){if(v==null)return "m";return up?(v>=g?"g":(v>=a?"a":"r")):(v<=g?"g":(v<=a?"a":"r"))}
function drooVal(w,f){if(!w)return null;var v=w[f];if(f==="d_rider"&&v==null&&(w.d_open!=null||w.d_prep!=null))return 0;return v==null?null:v}
function drooRoll(w){if(!w)return null;var b=DM.map(function(m){return band(drooVal(w,m[0]),m[2],m[3],m[4])});if(b.every(function(x){return x==="m"}))return null;if(b.indexOf("r")>=0)return "r";if(b.every(function(x){return x==="g"}))return "g";return "a"}
function rcell(v,r,txt){return '<td class="c'+(v==null?' rm':(r?' r'+r:''))+'">'+(v==null?'<span class="na">n/a</span>':txt)+'</td>'}
function pill(r,txt){return '<span class="ragpill '+(r||"m")+'">'+(txt||{g:"Green",a:"Amber",r:"Red",m:"n/a"}[r||"m"])+'</span>'}
function cnt(list){var o={g:0,a:0,r:0};list.forEach(function(x){if(o[x]!=null)o[x]++});return o}
function cntHtml(o){return '<span class="counts">'+pill("g",o.g+" green")+pill("a",o.a+" amber")+pill("r",o.r+" red")+'</span>'}

/* ---------- people scorecard: Lincoln, Kaitlin, Kei ---------- */
var PWEEK=null;

  var weeks=D.sites.weeks_available.slice().sort().reverse();

  var wk=PWEEK,T=D.targets;
  var pk=null;D.periods.forEach(function(p){if(p[2]===wk)pk=p[0]});
  function W(c){return (D.sites.by_week[wk]||{})[c]||null}
  var M=[
    {k:"Sales vs target",v:function(w){return w&&w.sales!=null&&w.sales_t?(w.sales/w.sales_t-1)*100:null},r:function(v){return rSales(v)},f:function(v){return (v>=0?"+":"")+v.toFixed(1)+"%"},t:function(){return "0% · Red Light at -10%"}},
    {k:"Labour %",v:function(w){return w&&w.wage},r:rLab,f:function(v){return v.toFixed(1)+"%"},t:function(c){return T[c]?T[c].labour+"%":""}},
    {k:"Food %",v:function(w){return w&&w.food},r:function(v){return rFood(v)},f:function(v){return v.toFixed(1)+"%"},t:function(){return "under 24%"}},
    {k:"Google reviews",v:function(w){return w&&w.rev},r:function(v,c){return share(v,T[c]&&T[c].reviews)},f:function(v){return fmt(v)},t:function(c){return T[c]?T[c].reviews:""}},
    {k:"Google rating",v:function(w){return w&&w.rev_avg},r:function(v){return rStar(v)},f:function(v){return v.toFixed(2)+"★"},t:function(){return "4.70"}},
    {k:"App sign ups",v:function(w,c){if(!T[c]||T[c].signups==null)return undefined;var S=D.signups&&D.signups.weekly[c];return S?(S[wk]||0):null},r:function(v,c){return share(v,T[c].signups)},f:function(v){return fmt(v)},t:function(c){return T[c]&&T[c].signups!=null?T[c].signups:"none"}},
    {k:"Compliance %",v:function(w,c){var M=D.compliance&&D.compliance[c];return M&&M[wk]&&M[wk].pct!=null?M[wk].pct:null},r:function(v){return rComp(v)},f:function(v){return v.toFixed(1)+"%"},t:function(){return "95%"}},
    {k:"Cleanliness /5",v:function(w,c){return pk?cleanScore(c,pk):null},r:function(v){return rClean(v)},f:function(v){return v.toFixed(1)},t:function(){return "3"}},
    {k:"Efficiency",v:function(w){return w&&w.eff},r:function(v){return rEff(v)},f:function(v){return v},t:function(){return "90"}},
    {k:"Deliveroo",v:function(w,c){if(!D.sites_meta[c].droo)return undefined;return drooRoll(w)},r:function(v){return v},f:function(v){return {g:"Green",a:"Amber",r:"Red"}[v]},t:function(){return "5 metrics"}}
  ];
  var opts=weeks.map(function(x){return '<option value="'+x+'"'+(x===wk?' selected':'')+'>w/c '+dd(x)+(x===weeks[0]?' (latest)':'')+'</option>'}).join('');
  var h='<div class="mini-hero"><h2>Team scorecard · w/c '+dd(wk)+'</h2><p>Lincoln, Kaitlin and Kei, each on their own sites. Green hits target, amber is close, red is a miss or a Red Light.</p></div>';
  h+='<div style="display:flex;align-items:center;gap:10px;margin:-4px 0 12px"><label class="muted" for="pweek" style="font-weight:700">Week</label><select id="pweek" class="wkpick">'+opts+'</select></div><div class="pcards">';
  OWN.forEach(function(o){
    var all=[],rows='';
    M.forEach(function(m){
      var cells='',any=false;
      o.sites.forEach(function(c){
        var w=W(c),v=m.v(w,c);

        any=true;var r=v==null?null:m.r(v,c);if(r)all.push(r);
        cells+=rcell(v,r,v==null?'':m.f(v));
      });
      if(any)rows+='<tr><td class="m">'+m.k+'</td>'+cells+'</tr>';
    });
    var b2b='';
    if(o.b2b&&D.b2b&&D.b2b.kpi){
      var bk=pk&&pk!=="base"&&pk!=="pre"?pk:"sep",K=D.b2b.kpi[bk];
      if(K){
        var BR=[["Active partnerships",K.partnerships,5],["Student stands",K.stands,4],["Paid events",K.paid_events,1],["Outreach, Lakeside",K["out_Lakeside"],10],["Outreach, Southampton",K["out_Southampton"],10],["Outreach, Soho",K["out_Soho"],10],["Outreach, Maki Nori",K["out_Maki Nori"],10],["Outreach, Shoreditch",K["out_Shoreditch"],10]];
        b2b='<tr class="band"><td colspan="'+(o.sites.length+1)+'">B2B · '+(bk==="sep"?"September":"this plan week")+'</td></tr>';
        BR.forEach(function(x){var r=share(x[1],x[2]);if(r)all.push(r);b2b+='<tr><td class="m">'+x[0]+' <span class="muted">/ '+x[2]+'</span></td>'+rcell(x[1],r,x[1]==null?'':fmt(x[1])).replace('<td class="c','<td colspan="'+o.sites.length+'" class="c')+'</tr>'});
      }

    h+='<div class="pcard '+worst+'"><h3>'+o.who+'</h3><div class="role">'+o.role+'</div>'+cntHtml(C)+
      '<div class="tblwrap" style="margin-top:10px"><table class="t"><tr><th>Measure</th>'+o.sites.map(function(c){return '<th class="c sitecell" data-site="'+c+'">'+D.sites_meta[c].name+'</th>'}).join('')+'</tr>'+rows+b2b+'</table></div></div>';
  });
  h+='</div>';
  return h;

    {k:"New Google reviews",t:function(c){return T[c].reviews},tl:function(c){return T[c].reviews},v:function(w){return w.rev},ok:function(v,c){return share(v,T[c].reviews)}},
    {k:"App sign ups",tl:function(c){return T[c].signups==null?'None':T[c].signups},v:function(w,c,wk){var S=D.signups&&D.signups.weekly[c];return S?(S[wk]!=null?S[wk]:0):null},ok:function(v,c){return T[c].signups==null?null:share(v,T[c].signups)},src:"new Ramen Royalty members, counted at the site of their first visit"},

    {k:"Compliance %",tl:function(){return '95%'},v:function(w,c,wk){var M=D.compliance&&D.compliance[c];if(!M)return null;return M[wk]&&M[wk].pct!=null?M[wk].pct:null},ok:function(v){return rComp(v)},dp:1,u:"%",src:"Mapal weekly compliance. Southampton is not on Mapal yet"},
    {k:"Training tracker %",tl:function(){return '95%'},v:function(){return null},src:"Management Training Tracker, feed not wired yet"},

function vDay(c,d){var V=D.vouchers;if(!V||c==="MakiNori")return null;var x=V.daily[c]&&V.daily[c][d];return x||[0,0,0]}

/* ---------- Deliveroo (08/10/2026): weekly RAG, weekly trend and daily ops, AM CC bands and colours ---------- */
var DWEEK=null;
function busyBand(v){return v==null?"m":(v<=0?"g":(v<=10?"a":"r"))}

  var codes=sitesIn(REGION,true),cur=curPeriod(),Q=D.droo_daily||{};

  var h='<div class="mini-hero"><h2>Deliveroo · '+REGION+'</h2><p>Weekly RAG from the Deliveroo ops report, and daily ops from Deliveroo\'s morning drops'+(Q.to?' (latest day '+dd(Q.to)+')':'')+'. Same bands and colours as the AM Control Centre.</p></div>';
  /* weekly RAG matrix */
  if(DWEEK){
    var W=D.sites.by_week[DWEEK]||{},QW=(Q.w||{})[DWEEK]||{},rows='',all=[];
    codes.forEach(function(c){
      var m=D.sites_meta[c];
      if(!m.droo){rows+='<tr><td class="m">'+m.name+'</td><td colspan="7" class="c"><span class="na">Not on Deliveroo</span></td></tr>';return}
      var w=W[c],roll=drooRoll(w);if(roll)all.push(roll);
      rows+='<tr><td class="m sitecell" data-site="'+c+'">'+m.name+(m.support?' <span class="pill p-n">support</span>':'')+'</td>';
      DM.forEach(function(d){var v=drooVal(w,d[0]),r=band(v,d[2],d[3],d[4]);rows+=rcell(v,r==="m"?null:r,v==null?'':fmt(v,d[5])+d[6])});
      var bz=(QW[c==="O2"?"MAF3":c]||[])[2];bz=bz==null?null:bz;var br=busyBand(bz);
      rows+=rcell(bz,br==="m"?null:br,bz==null?'':fmt(bz,1)+'%')+'<td class="c">'+pill(roll)+'</td></tr>';
    });
    var opts=withD.map(function(x){return '<option value="'+x+'"'+(x===DWEEK?' selected':'')+'>w/c '+dd(x)+'</option>'}).join('');
    h+='<div class="card"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">Weekly Deliveroo RAG</h2><select id="dweek" class="wkpick">'+opts+'</select><span style="margin-left:auto">'+cntHtml(cnt(all))+'</span></div>'+
      '<div class="sub" style="margin-top:6px">RED if any metric is red, GREEN if all five are green, otherwise AMBER. Rider wait blank means 0. Busy mode is shown, not scored.</div>'+
      '<div class="tblwrap"><table class="t"><tr><th>Site</th><th class="c">Rating</th><th class="c">Open %</th><th class="c">Prep</th><th class="c">Inaccurate %</th><th class="c">Rider wait %</th><th class="c">Busy mode %</th><th class="c">Overall</th></tr>'+rows+'</table></div>'+
      '<div class="legend"><span>Bands: rating 4.70 / 4.00 · open 98 / 95 · prep 15 / 18 min · inaccurate 2 / 3% · rider wait 2 / 4% · busy mode 0 green, up to 10% amber</span></div></div>';
  }
  /* weekly trend across the plan */
  var ncol=2+D.periods.length+(SHOW_RUNIN?runinWeeks().length:0);
  h+='<div class="card"><h2>Weekly trend · baseline to week 4</h2><div class="sub">Each cell is coloured on the AM CC bands. The arrow compares with the column before.</div><div class="tblwrap"><table class="t">'+
    headCols("Metric").replace('<th class="c">Target</th>','');
  DM.forEach(function(d){
    h+='<tr class="grp"><td colspan="'+ncol+'">'+d[1]+' <span style="text-transform:none;letter-spacing:0;color:var(--ink-3);font-weight:600">· green '+(d[4]?'at or above ':'at or under ')+d[2]+d[6]+'</span></td></tr>';
    codes.forEach(function(c){
      var meta=D.sites_meta[c];
      h+='<tr><td></td><td class="sitecell" data-site="'+c+'">'+meta.name+(meta.support?' <span class="pill p-n">support</span>':'')+'</td>';
      if(!meta.droo){h+='<td class="c" colspan="'+(ncol-2)+'"><span class="na">Not on Deliveroo</span></td></tr>';return}
      var prev=null,cols=[];
      if(SHOW_RUNIN)runinWeeks().forEach(function(wk){cols.push({v:drooVal(D.sites.by_week[wk][c],d[0]),now:false})});
      D.periods.forEach(function(p){var w=weekData(c,p[0]);cols.push({v:w===undefined?undefined:drooVal(w,d[0]),now:p[0]===cur})});

/* Daily Deliveroo ops (09/10/2026): restyled to match the AM Control Centre Deliveroo panel. One table per site, one header:
   weekly rows (Deliveroo weekly summary, latest two weeks) and daily rows (last 7 days) share the same 10 columns, the same
   AM CC bands (DM) and the same tints, then the 7 day total against the 7 days before. Rating, AOV are weekly only at Deliveroo.
   Weekly Overall: RED if any of the five is red, GREEN if all green, else AMBER. Day Overall: same over what Deliveroo reports by day. */
function drooTint(b){return b==="g"?"background:#ecfdf5;color:var(--green)":b==="a"?"background:#fffbeb;color:var(--amber)":b==="r"?"background:#fef2f2;color:var(--red)":"color:var(--ink-3)"}
function drooDaily(codes,showCard){
  var Q=D.droo_daily;
  if(!Q||!Q.d||!Object.keys(Q.d).length)return showCard?'<div class="card"><h2>Daily Deliveroo ops</h2><div class="sub">The daily Deliveroo file has not landed yet.</div></div>':'<div class="sub">The daily Deliveroo file has not landed yet.</div>';
  var keys=Object.keys(Q.d).sort(),last=Q.to&&Q.d[Q.to]?Q.to:keys[keys.length-1];
  function addD(d,n){return new Date(Date.parse(d+"T00:00:00Z")+n*864e5).toISOString().slice(0,10)}
  function dow(d){return ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][(new Date(d+"T00:00:00Z").getUTCDay()+6)%7]}
  function sd(d){return dow(d)+" "+dd(d)}
  var days=[],prv=[];for(var i=6;i>=0;i--)days.push(addD(last,-i));for(var j=13;j>=7;j--)prv.push(addD(last,-j));
  var dot='<span class="na">·</span>',wkc='<td class="roo-wk" title="Deliveroo reports this weekly only">weekly</td>';
  function n1(v,dp,u){return v==null?dot:Number(v).toFixed(dp)+(u||"")}
  function gbp(v){return v==null?dot:"£"+fmt(Math.round(v))}
  function dm(f){return DM.filter(function(x){return x[0]===f})[0]}
  function bnd(f,v){var m=dm(f);return band(v,m[2],m[3],m[4])}
  function cell(f,v,dp){return '<td style="'+drooTint(bnd(f,v))+'">'+n1(v,dp)+'</td>'}
  function busy(v){return '<td style="'+drooTint(busyBand(v))+'">'+n1(v,1)+'</td>'}
  function roll(m,skipRating){var P={r:[],a:[],g:[]};DM.forEach(function(x){if(skipRating&&x[0]==="d_rating")return;var b=bnd(x[0],m[x[0]]);if(P[b])P[b].push(x[1])});
    var rag=P.r.length?"r":P.a.length?"a":P.g.length?"g":"m",t=[];if(P.r.length)t.push("red: "+P.r.join(" · "));if(P.a.length)t.push("amber: "+P.a.join(" · "));return {rag:rag,why:t.length?t.join("  |  "):"all green"}}
  function ovr(r){return '<td style="'+drooTint(r.rag)+';font-weight:800" title="'+r.why+'">'+(r.rag==="m"?"·":{g:"GREEN",a:"AMBER",r:"RED"}[r.rag])+'</td>'}
  function wow(cur,base,lab){if(cur==null||!base)return "";var p=(cur-base)/base*100;return '<span class="sub2 '+(p>=0?'up':'dn')+'">'+(p>=0?"+":"")+p.toFixed(1)+"% "+lab+"</span>"}
  function q(c,d){var x=Q.d[d]||{};return x[c]||x[c==="O2"?"MAF3":c]||null}
  function qw(c,wk){var x=(Q.w||{})[wk]||{};return x[c]||x[c==="O2"?"MAF3":c]||null}
  function delv(c,d){var r=D.daily&&D.daily.sites&&D.daily.sites[c]&&D.daily.sites[c][d];return r&&r.delivery!=null?r.delivery:null}
  function rider(x){if(!x)return null;return x[8]==null?((x[1]!=null||x[9]!=null)?0:null):x[8]}
  var wks=(D.sites.weeks_available||[]).filter(function(w){return w<=last}).sort().reverse().slice(0,2);
  function panel(c){
    var meta=D.sites_meta[c];
    var h='<div class="roo-panel"><h4><span class="sitecell" data-site="'+c+'">Deliveroo · '+meta.name+'</span>'+(meta.support?' <span class="pill p-n">support</span>':'')+'</h4>';
    if(!meta.droo)return h+'<div class="sub">Not on Deliveroo.</div></div>';
    h+='<div class="tblwrap"><table class="roo-full"><colgroup><col class="c-lab"><col span="10" class="c-m"></colgroup><thead><tr><th></th><th>Revenue</th><th>Orders</th><th>AOV</th><th>Rating</th><th>Open %</th><th>Prep</th><th>Inacc %</th><th>Rider %</th><th>Busy %</th><th>Overall</th></tr></thead><tbody>';
    h+='<tr class="roo-band"><td colspan="11">Weekly · Deliveroo weekly summary</td></tr>';
    var wr=0;
    wks.forEach(function(wk){
      var w=(D.sites.by_week[wk]||{})[c];if(!w||!drooRoll(w))return;wr++;
      var m={d_rating:w.d_rating,d_open:w.d_open,d_prep:w.d_prep,d_inacc:w.d_inacc,d_rider:drooVal(w,"d_rider")},bz=(qw(c,wk)||[])[2];
      var aov=w.d_sales!=null&&w.d_orders?w.d_sales/w.d_orders:null;
      h+='<tr><td>w/c '+sd(wk)+(wk>addD(last,-6)?' <span class="na">(partial)</span>':'')+'</td><td><b>'+gbp(w.d_sales)+'</b></td><td>'+(w.d_orders==null?dot:fmt(w.d_orders))+'</td><td>'+(aov==null?dot:"£"+aov.toFixed(2))+'</td>'
        +cell("d_rating",m.d_rating,2)+cell("d_open",m.d_open,1)+cell("d_prep",m.d_prep,1)+cell("d_inacc",m.d_inacc,1)+cell("d_rider",m.d_rider,1)+busy(bz==null?null:bz)+ovr(roll(m,false))+'</tr>';
    });
    if(!wr)h+='<tr><td colspan="11" class="na" style="text-align:left">No weekly Deliveroo figures for this site yet.</td></tr>';
    h+='<tr class="roo-band"><td colspan="11">Daily · last 7 days to '+sd(last)+'</td></tr>';
    days.forEach(function(d){

      h+='<tr'+(d===last?' class="sel"':'')+'><td>'+sd(d)+'</td><td><b>'+gbp(v)+'</b>'+wow(v,delv(c,addD(d,-7)),"vs last wk")+'</td>';
      if(!x){h+='<td colspan="9" class="na" style="text-align:left">no Deliveroo row</td></tr>';return}
      var m={d_open:x[9],d_prep:x[1],d_inacc:x[3],d_rider:rider(x)};
      h+='<td>'+(x[0]==null?dot:x[0])+'</td>'+wkc+wkc+cell("d_open",m.d_open,1)+cell("d_prep",m.d_prep,1)+cell("d_inacc",m.d_inacc,1)+cell("d_rider",m.d_rider,1)+busy(x[10])+ovr(roll(m,true))+'</tr>';
    });
    function agg(ds){
      var o={n:0,ord:0,pw:0,pn:0,mw:0,mn:0,dv:0,dn:0,x:[[0,0],[0,0],[0,0]]};
      ds.forEach(function(d){var v=delv(c,d);if(v!=null){o.dv+=v;o.dn++}var x=q(c,d);if(!x)return;o.n++;o.ord+=x[0]||0;var wt=x[0]||1;
        if(x[1]!=null){o.pw+=x[1]*wt;o.pn+=wt}if(x[3]!=null){o.mw+=x[3]*wt;o.mn+=wt}
        [rider(x),x[9],x[10]].forEach(function(xv,e){if(xv!=null){o.x[e][0]+=xv;o.x[e][1]++}})});
      o.prep=o.pn?o.pw/o.pn:null;o.miss=o.mn?o.mw/o.mn:null;o.rev=o.dn?o.dv:null;
      o.rw=o.x[0][1]?o.x[0][0]/o.x[0][1]:null;o.op=o.x[1][1]?o.x[1][0]/o.x[1][1]:null;o.bz=o.x[2][1]?o.x[2][0]/o.x[2][1]:null;return o;
    }
    var A=agg(days),B=agg(prv);
    function tot(lab,o,base){
      if(!o.n&&o.rev==null)return '<tr class="roo-tot"><td>'+lab+'</td><td colspan="10" class="na" style="text-align:left">no figures</td></tr>';
      var m={d_open:o.op,d_prep:o.prep,d_inacc:o.miss,d_rider:o.rw};
      return '<tr class="roo-tot"><td>'+lab+'</td><td>'+gbp(o.rev)+(base?wow(o.rev,base.rev,"vs prior 7"):"")+'</td><td>'+(o.n?fmt(o.ord):dot)+'</td>'+wkc+wkc
        +cell("d_open",o.op,1)+cell("d_prep",o.prep,1)+cell("d_inacc",o.miss,1)+cell("d_rider",o.rw,1)+busy(o.bz)+ovr(roll(m,true))+'</tr>';
    }
    h+=tot("7 days to "+sd(last),A,B)+tot("7 days before",B,null)+'</tbody></table></div></div>';
    return h;
  }
  var body=codes.map(panel).join('');
  if(!showCard)return body;
  return '<div class="card"><h2>Daily Deliveroo ops · last 7 days to '+sd(last)+'</h2><div class="sub">Same layout, bands and colours as the AM Control Centre Deliveroo panel. Weekly rows from Deliveroo\'s weekly summary, daily rows from Deliveroo\'s morning drops. Overall: RED if any metric is red, GREEN if all green, otherwise AMBER (rating is weekly only). Rider wait blank means 0. Busy mode is shown, not scored. Revenue is delivery £ from the cash up (all platforms).</div>'+body+'<div class="legend"><span>Bands: rating 4.70 / 4.00 · open 98 / 95 · prep 15 / 18 min · inaccurate 2 / 3% · rider wait 2 / 4% · busy mode 0 green, up to 10% amber</span><span>Source: Deliveroo Daily Master (morning drops, ingested hourly)</span></div></div>';

    k("Sign ups today",(D.signups&&D.signups.daily[c])?((D.signups.daily[c][latest])||0):'n/a',null,'first visit at this site')+

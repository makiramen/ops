<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AM Control Centre</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --maki-orange:#E94E1B;--maki-orange-soft:#F47C24;--maki-orange-bg:#FFF1EA;--maki-orange-ring:#E94E1B33;
  --maki-ink:#1A1410;--maki-cream:#FFF8F0;
  --bg:#f4f5f9;--surface:#fff;--surface-2:#fafbfd;--ink:#0f172a;--ink-2:#475569;--ink-3:#94a3b8;--line:#e2e8f0;
  --red:#dc2626;--red-bg:#fef2f2;--amber:#d97706;--amber-bg:#fffbeb;--green:#059669;--green-bg:#ecfdf5;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 12px rgba(15,23,42,.06);
  --shadow-lg:0 4px 24px rgba(15,23,42,.08),0 16px 40px rgba(15,23,42,.12);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:24px}

/* header: copy of the AM Control Centre header */
.maki-brand-bar{background:var(--maki-cream);border-bottom:2px solid var(--maki-orange);padding:14px 32px;display:flex;align-items:center;gap:18px;box-shadow:0 1px 0 rgba(233,78,27,.06)}
.maki-logo{height:48px;width:auto;display:block;flex-shrink:0}
.maki-brand-title{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.maki-brand-name{font-size:14px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--maki-ink);line-height:1}
.maki-brand-name .dot{color:var(--maki-orange);margin:0 8px}
.maki-brand-sub{font-size:13px;font-weight:600;color:var(--maki-orange);line-height:1.2}
.maki-brand-kanji{font-family:"Noto Sans JP","Plus Jakarta Sans",sans-serif;font-size:13px;font-weight:700;color:var(--maki-orange);letter-spacing:.04em;white-space:nowrap;cursor:default;user-select:none;-webkit-user-select:none;transition:text-shadow .3s}
.maki-brand-kanji:hover{text-shadow:0 0 1px rgba(233,78,27,.25)}
.maki-brand-chip{background:var(--maki-orange-bg);border:1px solid var(--maki-orange-ring);color:var(--maki-orange);padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.week-toggle-bar{display:flex;align-items:center;gap:8px}
.week-toggle-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.week-select{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
@media(max-width:720px){.maki-brand-bar{padding:10px 16px;gap:12px;flex-wrap:wrap}.maki-logo{height:38px}.week-toggle-bar{width:100%}}

.shell-note{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:28px;color:var(--ink-3);text-align:center;font-size:13px}

/* ============ GATE ============ */
#gate{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% 40%,rgba(233,78,27,.28),rgba(26,20,16,.92) 60%),#1A1410;padding:16px}
#gate.open{display:flex;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.gate-card{width:100%;max-width:420px;background:#1f1813;border:1px solid rgba(233,78,27,.35);border-radius:20px;padding:34px 28px 26px;color:#fff;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5);position:relative;overflow:hidden}
.gate-card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--maki-orange),var(--maki-orange-soft))}
.torii{font-family:"Noto Sans JP",sans-serif;font-weight:900;font-size:64px;line-height:1;color:var(--maki-orange);text-shadow:0 0 30px rgba(233,78,27,.55);margin-bottom:6px}
.gate-title{font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#f8e9df}
.gate-sub{font-size:12.5px;color:#b9a99c;margin:6px 0 22px}
.gate-input{width:100%;font:inherit;font-size:16px;text-align:center;letter-spacing:.2em;padding:13px 14px;border-radius:12px;border:1px solid #4a3a2f;background:#14100c;color:#fff;outline:none}
.gate-input:focus{border-color:var(--maki-orange);box-shadow:0 0 0 3px rgba(233,78,27,.25)}
.gate-btn{margin-top:12px;width:100%;font:inherit;font-weight:800;font-size:14px;letter-spacing:.06em;padding:12px;border:0;border-radius:12px;background:var(--maki-orange);color:#fff;cursor:pointer}
.gate-btn:hover{background:#d4430f}
.gate-err{min-height:18px;font-size:12px;color:#fca5a5;margin-top:10px}
.gate-close{position:absolute;top:10px;right:12px;background:none;border:0;color:#8c7b6e;font-size:22px;cursor:pointer;line-height:1}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.regions{display:grid;gap:12px;margin-top:4px}
.region-btn{display:block;width:100%;text-align:left;font:inherit;color:#fff;background:#14100c;border:1px solid #4a3a2f;border-radius:14px;padding:16px 18px;cursor:pointer;transition:all .15s}
.region-btn:hover{border-color:var(--maki-orange);background:#22180f;transform:translateY(-1px)}
.region-btn b{display:block;font-size:20px;font-weight:800}
.region-btn span{font-size:12.5px;color:#b9a99c}
.region-btn i{font-style:normal;font-family:"Noto Sans JP",sans-serif;color:var(--maki-orange);float:right;font-weight:900;font-size:22px;margin-top:2px}

/* ============ AREA ROOM ============ */
#room{position:fixed;inset:0;z-index:150;background:var(--bg);overflow:auto;display:none}
#room.open{display:block;animation:fadeIn .3s ease}
.room-bar{position:sticky;top:0;z-index:20;background:#1A1410;color:#fff;border-bottom:3px solid var(--maki-orange);padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.room-mark{font-family:"Noto Sans JP",sans-serif;font-weight:900;font-size:24px;color:var(--maki-orange)}
.room-title{font-weight:800;font-size:16px;letter-spacing:.02em}
.room-title small{display:block;font-size:11.5px;font-weight:500;color:#b9a99c;letter-spacing:0}
.seg{display:inline-flex;background:#2a211b;border-radius:10px;padding:3px;margin-left:auto}
.seg button{font:inherit;font-size:12.5px;font-weight:700;color:#d6c7bb;background:none;border:0;padding:7px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--maki-orange);color:#fff}
.room-x{background:none;border:1px solid #4a3a2f;color:#d6c7bb;border-radius:9px;padding:6px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.room-x:hover{border-color:var(--maki-orange);color:#fff}
.room-wrap{max-width:1280px;margin:0 auto;padding:20px 24px 60px}
.tabbar{display:flex;flex-wrap:wrap;gap:4px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:12px;padding:7px;margin-bottom:18px;box-shadow:var(--shadow)}
.tabbar::-webkit-scrollbar{display:none}
.tabbtn{flex:none;border:0;background:transparent;color:var(--ink-2);font-weight:600;font-size:13px;padding:8px 14px;border-radius:9px;cursor:pointer;font-family:inherit;white-space:nowrap}
.tabbtn:hover{background:var(--surface-2);color:var(--ink)}
.tabbtn.active{background:var(--maki-orange-bg);color:var(--maki-orange)}
.pane{display:none}.pane.on{display:block}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:15.5px;font-weight:800}
.card .sub{font-size:12px;color:var(--ink-3);margin-bottom:12px}
.grid-sites{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.site-tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);border-top:3px solid var(--maki-orange)}
.site-tile h3{margin:0;font-size:15px;font-weight:800}
.site-tile .lead{font-size:11.5px;color:var(--ink-3);margin-bottom:8px}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;border-bottom:1px dashed #eef1f5}
.kv:last-child{border:0}
.kv span{color:var(--ink-2)}.kv b{font-weight:700}

.tblwrap{overflow-x:auto;margin:0 -4px}
table.t{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
table.t th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);background:#f6f2ec;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th.c,table.t td.c{text-align:center}
table.t td{padding:8px 10px;border-bottom:1px solid #eef1f5;vertical-align:middle}
table.t tr.grp td{background:#fcfaf7;font-weight:800;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--maki-orange);padding-top:10px}
table.t td.m{font-weight:600}
table.t th.now{background:var(--maki-orange-bg);color:var(--maki-orange)}
table.t td.now{background:#fffaf6}
.cell{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.g{background:var(--green)}.dot.r{background:var(--red)}.dot.a{background:var(--amber)}.dot.n{background:#cbd5e1}
.na{color:var(--ink-3);font-size:11.5px;font-weight:600}
.fut{color:#cbd5e1;font-weight:700}
.sch{color:var(--ink-3);font-style:italic;font-weight:600;font-size:12px}
.arr{font-size:11px;font-weight:800}
.arr.g{color:var(--green)}.arr.r{color:var(--red)}.arr.n{color:var(--ink-3)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-g{background:var(--green-bg);color:var(--green)}.p-a{background:var(--amber-bg);color:var(--amber)}.p-r{background:var(--red-bg);color:var(--red)}.p-n{background:#f1f5f9;color:#64748b}.p-o{background:var(--maki-orange-bg);color:var(--maki-orange)}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--maki-orange-bg);border:1px solid var(--maki-orange-ring);color:#7c2d12;border-radius:12px;padding:12px 14px;font-size:12.5px;margin-bottom:14px}
.banner b{color:var(--maki-orange)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin:8px 0 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.chk{font-size:12px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.row2{grid-template-columns:1fr}}
.bar{height:8px;border-radius:5px;background:#eef1f5;overflow:hidden}
.bar i{display:block;height:100%;background:var(--maki-orange);border-radius:5px}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.person{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);position:relative}
.person .av{width:40px;height:40px;border-radius:12px;background:var(--maki-orange);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px;float:left;margin-right:12px}
.person h3{margin:0;font-size:15px;font-weight:800}
.person .role{font-size:12px;color:var(--ink-3);margin-bottom:12px}
.person .today{clear:both;background:#fcfaf7;border-radius:10px;padding:10px 12px;font-size:13px}
.person .today b{color:var(--maki-orange)}
.person ul{margin:10px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-2)}
.person li{margin:3px 0}
.timeline{list-style:none;margin:0;padding:0}
.timeline li .pill{align-self:flex-start}
.timeline li{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed #eef1f5;font-size:13px}
.timeline li:last-child{border:0}
.timeline .when{flex:none;width:92px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}
.timeline li.past{opacity:.45}
.timeline li.next .when{color:var(--maki-orange)}
.muted{color:var(--ink-3);font-size:12px}
.foot{font-size:11.5px;color:var(--ink-3);margin-top:20px;text-align:center}
@media(max-width:720px){.room-bar{padding:10px 16px}.room-wrap{padding:14px 16px 50px}.seg{margin-left:0}}

/* site daily sheet */
#sheet{position:fixed;inset:0;z-index:180;display:none;background:rgba(15,10,6,.45)}
#sheet.open{display:block;animation:fadeIn .2s ease}
.sheet-panel{position:absolute;top:0;right:0;bottom:0;width:min(860px,100%);background:var(--bg);overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.25);animation:slideIn .25s ease}
@keyframes slideIn{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{position:sticky;top:0;z-index:5;background:#1A1410;color:#fff;border-bottom:3px solid var(--maki-orange);padding:14px 20px;display:flex;align-items:center;gap:12px}
.sheet-head h2{margin:0;font-size:18px;font-weight:800}
.sheet-head small{display:block;color:#b9a99c;font-size:12px;font-weight:500}
.sheet-body{padding:18px 20px 50px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi span{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.kpi b{display:flex;align-items:center;gap:7px;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi small{color:var(--ink-3);font-size:11.5px}
.rv{border-bottom:1px dashed #eef1f5;padding:9px 0;font-size:13px}
.rv:last-child{border:0}
.rv .st{font-weight:800;color:var(--maki-orange);margin-right:6px;letter-spacing:1px}
.rv.bad .st{color:var(--red)}
.rv .who{color:var(--ink-3);font-size:11.5px}
[data-site]{cursor:pointer}
.site-tile[data-site]:hover{border-color:var(--maki-orange);transform:translateY(-1px);transition:.15s}
td.sitecell[data-site]:hover{color:var(--maki-orange);text-decoration:underline}
.negbtn{font:inherit;font-size:11.5px;font-weight:700;color:var(--red);background:var(--red-bg);border:1px solid #fecaca;border-radius:999px;padding:2px 9px;cursor:pointer;margin-left:4px}
.negbtn:hover{background:var(--red);color:#fff}
.tap{font-size:11px;color:var(--maki-orange);font-weight:700;margin-top:6px}
</style>
</head>

<script>
(function(){
"use strict";
var BLOB=JSON.parse(document.getElementById("payload").textContent);
var D=null, REGION="South", SHOW_RUNIN=false;
var $=function(id){return document.getElementById(id)};
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function same(a,b){if(a.length!==b.length)return false;var ok=true;for(var i=0;i<a.length;i++)if(a[i]!==b[i])ok=false;return ok}
function unlock(name,pw){
  return new Promise(function(res,rej){setTimeout(function(){
    try{
      var U=BLOB.u&&BLOB.u[name];if(!U)return rej(new Error("bad"));
      var ku=PC.pbkdf2(new TextEncoder().encode(pw),b64(U.s),BLOB.n,64),ui=b64(U.i),wk=b64(U.k);
      var wm=new Uint8Array(ui.length+wk.length);wm.set(ui);wm.set(wk,ui.length);
      if(!same(PC.hmac(ku.subarray(32),wm),b64(U.t)))return rej(new Error("bad"));
      var km=PC.ctr(ku.subarray(0,32),ui,wk),iv=b64(BLOB.i),ct=b64(BLOB.c),tag=b64(BLOB.t);
      var m=new Uint8Array(iv.length+ct.length);m.set(iv);m.set(ct,iv.length);
      var calc=PC.hmac(km.subarray(32),m),ok=calc.length===tag.length;
      for(var i=0;i<tag.length;i++)if(calc[i]!==tag[i])ok=false;
      if(!ok)return rej(new Error("bad"));
      res(JSON.parse(new TextDecoder().decode(PC.ctr(km.subarray(0,32),iv,ct))));
    }catch(e){rej(e)}
  },30)});
}
function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){return null}}

/* ---------- logins + usage log (Area Room log sheet, Michael only) ---------- */
var LOG_URL="https://script.google.com/macros/s/AKfycbyVrmiIOv3loHNtR-s6c_d5tfJKe8HXWfy29XdvKt3iz_uWJzK2Ul_89q9BMFYbWu2B/exec";
function logUse(name,kind){
  if(!LOG_URL||LOG_URL.indexOf("http")!==0)return;
  try{fetch(LOG_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},keepalive:true,
    body:JSON.stringify({name:name,kind:kind,at:new Date().toISOString(),w:screen.width,ua:navigator.userAgent.slice(0,160)})}).catch(function(){})}catch(e){}
}
Object.keys(BLOB.u||{}).forEach(function(n){var o=document.createElement("option");o.value=n;o.textContent=n;$("guser").appendChild(o)});

/* ---------- gate wiring ---------- */
var clicks=0,timer=null;
$("kanji").addEventListener("click",function(){
  openGate();
});
function openGate(){
  $("gate").classList.add("open");
  var saved=ss("ar_pw"),su=ss("ar_u");
  if(saved&&su&&!D){$("guser").value=su;tryPw(saved,true);return}
  if(D){showRegions();return}
  $("step-pass").style.display="";
  setTimeout(function(){($("guser").value?$("gpass"):$("guser")).focus()},50);
}
function closeGate(){$("gate").classList.remove("open");$("gerr").textContent="";$("gpass").value=""}
$("gclose").onclick=closeGate;
$("gate").addEventListener("click",function(e){if(e.target===$("gate"))closeGate()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if($("room").classList.contains("open"))return;closeGate()}});
$("gbtn").addEventListener("click",function(){tryPw($("gpass").value,false)});
$("gpass").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();tryPw($("gpass").value,false)}});
function tryPw(pw,silent){
  var who=$("guser").value;
  if(!who){$("gerr").textContent="Pick your name first.";$("guser").focus();return}
  if(!pw)return;
  $("gerr").textContent="Opening…";
  unlock(who,pw.trim().toLowerCase()).then(function(data){
    D=data;ss("ar_pw",pw.trim().toLowerCase());ss("ar_u",who);logUse(who,silent?"reopened":"logged in");showRegions();
  }).catch(function(){
    ss("ar_pw",null);if(!silent)logUse(who,"wrong password");
    if(!silent){$("gerr").textContent="That is not the word.";var c=$("gcard");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");$("gpass").select()}
    else{$("step-pass").style.display="";$("gpass").focus()}
  });
}
function showRegions(){closeGate();openRoom()}
Array.prototype.forEach.call(document.querySelectorAll(".region-btn"),function(b){b.onclick=function(){REGION=b.dataset.r;closeGate();openRoom()}});
Array.prototype.forEach.call(document.querySelectorAll("#rseg button"),function(b){b.onclick=function(){REGION=b.dataset.r;render()}});
$("rlock").onclick=function(){$("room").classList.remove("open");document.body.style.overflow="";ss("ar_pw",null);ss("ar_u",null);D=null};
if(location.hash==="#enter")setTimeout(openGate,0);
Array.prototype.forEach.call(document.querySelectorAll(".tabbtn"),function(b){b.onclick=function(){
  Array.prototype.forEach.call(document.querySelectorAll(".tabbtn"),function(x){x.classList.toggle("active",x===b)});
  Array.prototype.forEach.call(document.querySelectorAll(".pane"),function(p){p.classList.toggle("on",p.id==="p-"+b.dataset.p)});
}});
function openRoom(){$("room").classList.add("open");document.body.style.overflow="hidden";render()}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(v,dp){if(v==null||v==="")return null;return Number(v).toLocaleString("en-GB",{minimumFractionDigits:dp||0,maximumFractionDigits:dp||0})}
function dd(iso){var p=iso.split("-");return p[2]+"/"+p[1]}
function sitesIn(r,incSupport){var out=[];for(var c in D.sites_meta){var m=D.sites_meta[c];if(incSupport||!m.support)out.push(c)}return out}
function todayISO(){return D.today}
function curPeriod(){var t=todayISO();for(var i=0;i<D.periods.length;i++){var p=D.periods[i];if(t>=p[2]&&t<=p[3])return p[0]}return null}
function weekData(code,pkey){
  var p=D.periods.filter(function(x){return x[0]===pkey})[0];if(!p)return null;
  var w=D.sites.by_week[p[2]];return w?(w[code]||null):undefined;
}
function runinWeeks(){return D.sites.weeks_available.filter(function(w){return w<"2026-09-28"})}
function cell(v,ok,unit,dp){
  if(v===undefined)return '<span class="fut">·</span>';
  if(v==null)return '<span class="na">n/a</span>';
  var cls=ok==null?"n":(ok?"g":"r");
  return '<span class="cell"><span class="dot '+cls+'"></span>'+fmt(v,dp)+(unit||"")+'</span>';
}
function headCols(first){
  var cur=curPeriod(),h='<tr><th>'+first+'</th><th>Site</th><th class="c">Target</th>';
  if(SHOW_RUNIN)runinWeeks().forEach(function(w){h+='<th class="c">w/c '+dd(w)+'</th>'});
  D.periods.forEach(function(p){h+='<th class="c'+(p[0]===cur?' now':'')+'">'+p[1]+'<br><span style="font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink-3)">'+dd(p[2])+'</span></th>'});
  return h+'</tr>';
}

/* ---------- render ---------- */
function render(){
  Array.prototype.forEach.call(document.querySelectorAll("#rseg button"),function(b){b.classList.toggle("on",b.dataset.r===REGION)});
  $("rtitle").textContent="Area Room · South";
  $("rsub").textContent="Lincoln (AM) · Kaitlin (DAM) · Kei (B2B, acting GM Lakeside) · Month 1 runs 12/10 to 08/11";
  $("foot").textContent="Built "+D.built+" · Data encrypted on the page · Lock when done";
  renderScore();renderDeliv();renderClean();renderB2B();renderTeam();
}

function renderScore(){
  var codes=sitesIn(REGION,false),T=D.targets,cur=curPeriod();
  var tiles='<div class="grid-sites">';
  codes.forEach(function(c){
    var m=D.sites_meta[c],w=weekData(c,"base")||{};
    var sv=(w.sales!=null&&w.sales_t)?((w.sales/w.sales_t-1)*100):null;
    tiles+='<div class="site-tile" data-site="'+c+'"><h3>'+m.name+'</h3><div class="lead">'+esc(m.lead)+' · GM '+esc(w.gm||"TBC")+'</div>'+
      '<div class="kv"><span>Sales vs target</span><b style="color:'+(sv==null?'inherit':(sv>=0?'var(--green)':'var(--red)'))+'">'+(sv==null?'n/a':(sv>=0?'+':'')+sv.toFixed(1)+'%')+'</b></div>'+
      '<div class="kv"><span>Sales</span><b>£'+fmt(w.sales)+'</b></div>'+
      '<div class="kv"><span>Covers</span><b>'+fmt(w.covers)+'</b></div>'+
      '<div class="kv"><span>Food %</span><b>'+(w.food!=null?w.food.toFixed(1)+'%':'n/a')+'</b></div>'+
      '<div class="kv"><span>Efficiency</span><b>'+(w.eff!=null?w.eff:'n/a')+'</b></div><div class="tap">Open daily ›</div></div>';
  });
  tiles+='</div>';
  var rows=[

  var days=Object.keys(Q.d).sort(),last=days[days.length-1];
  function addD(d,n){return new Date(Date.parse(d+"T00:00:00Z")+n*864e5).toISOString().slice(0,10)}
  function dm(d){return d.slice(8,10)+"/"+d.slice(5,7)}
  function dow(d){return ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][(new Date(d+"T00:00:00Z").getUTCDay()+6)%7]}
  var cur=[],prv=[];for(var i=6;i>=0;i--)cur.push(addD(last,-i));for(var j=13;j>=7;j--)prv.push(addD(last,-j));
  function agg(c,ds){var o={n:0,orders:0,pw:0,pn:0,red:0,miss:0,rej:0,can:0};ds.forEach(function(d){var q=Q.d[d]&&Q.d[d][c];if(!q)return;o.n++;o.orders+=q[0]||0;if(q[1]!=null){o.pw+=q[1]*(q[0]||1);o.pn+=(q[0]||1)}if(q[7])o.red++;if(q[3])o.miss++;o.rej+=q[6]||0;o.can+=q[4]||0});o.prep=o.pn?o.pw/o.pn:null;return o}

  h+='<th class="c">7 days</th><th class="c">Baseline<br><span style="font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink-3)">'+dm(prv[0])+' to '+dm(prv[6])+'</span></th></tr>';

      ["Prep min",function(q){return q[1]==null?'<span class="na">n/a</span>':'<span class="cell"><span class="dot '+(q[7]?'r':'g')+'"></span>'+q[1].toFixed(1)+'</span>'},function(o){return o.prep==null?'<span class="na">n/a</span>':'<span class="cell"><span class="dot '+(o.red?'r':'g')+'"></span>'+o.prep.toFixed(1)+(o.red?' <span class="na">'+o.red+' red</span>':'')+'</span>'}],
      ["Issues",function(q){var iss=[];if(q[3])iss.push(q[3].toFixed(1)+'% miss');if(q[6])iss.push(q[6]+' rej');if(q[4])iss.push(q[4]+' can');return iss.length?'<span style="color:var(--red);font-weight:700;font-size:11.5px">'+iss.join(', ')+'</span>':'<span class="dot g"></span>'},function(o){if(!o.n)return '<span class="na">n/a</span>';var iss=[];if(o.miss)iss.push(o.miss+'d miss');if(o.rej)iss.push(o.rej+' rej');if(o.can)iss.push(o.can+' can');return iss.length?'<span style="color:var(--red);font-weight:700;font-size:11.5px">'+iss.join(', ')+'</span>':'<span class="dot g"></span>'}]];
    rows.forEach(function(r,i){

  return h;
}

function openDaily(c){
  var m=D.sites_meta[c],S=D.daily.sites[c],dates=D.daily.dates,T=D.targets[c]||{},wk=weekData(c,"base")||{};
  var latest=dates[0],L=S[latest]||{};

    k("Wage %",L.wage!=null?L.wage.toFixed(1)+'%':'n/a',(L.wage!=null&&T.labour)?L.wage<=T.labour:null,T.labour?'target '+T.labour+'% · '+(L.hours!=null?L.hours+' hrs':''):'')+
    k("Reviews today",L.rev_n!=null?L.rev_n:'n/a',null,L.rev_avg!=null?'avg '+L.rev_avg.toFixed(2)+'★'+(L.rev_neg?' · '+L.rev_neg+' negative':''):'')+
    k("Sign ups today",(D.signups&&D.signups.daily[c])?((D.signups.daily[c][latest])||0):'n/a',null,'first visit at this site')+
    (function(){if(c==="MakiNori")return k("Vouchers today",'n/a',null,'Maki Nori is not on Ramen Royalty');var x=vDay(c,latest);return k("Vouchers today",x?x[0]:'n/a',null,x?(x[1]+' £5 welcome · '+(x[0]-x[1])+' rewards'):'')})()+
    k("Delivery sales",L.delivery!=null?'£'+fmt(L.delivery):'n/a',null,'from the cash up')+'</div>';
  /* last 7 days */

  h+='<div class="card"><h2>Last '+dates.length+' days</h2><div class="sub">Latest cash up on top.</div><div class="tblwrap"><table class="t" style="min-width:600px"><tr><th>Day</th><th class="c">Sales</th><th class="c">vs target</th><th class="c">Covers</th><th class="c">Spend</th><th class="c">Wage %</th><th class="c">Hours</th><th class="c">Sign ups</th><th class="c">Vouchers</th><th class="c">Reviews</th></tr>';

      '<td class="c">'+(r.vs!=null?'<span class="cell"><span class="dot '+(r.vs>=0?'g':'r')+'"></span>'+(r.vs>=0?'+':'')+r.vs.toFixed(1)+'%</span>':'<span class="na">n/a</span>')+'</td>'+
      '<td class="c">'+(r.covers!=null?fmt(r.covers):'')+'</td><td class="c">'+(r.spend!=null?'£'+r.spend.toFixed(2):'')+'</td>'+

      '<td class="c">'+(r.hours!=null?r.hours:'')+'</td><td class="c">'+((D.signups&&D.signups.daily[c])?(D.signups.daily[c][d]||0):'<span class="na">n/a</span>')+'</td><td class="c">'+(function(){var x=vDay(c,d);return x?(x[0]+(x[0]?' <small style="color:var(--ink-3)">£5 '+x[1]+'</small>':'')):'<span class="na">n/a</span>'})()+'</td><td class="c">'+(r.rev_n!=null?r.rev_n+(r.rev_neg?' <button class="negbtn" data-neg="'+d+'">'+r.rev_neg+' neg ›</button>':''):'')+'</td></tr>'});

    var d=b.dataset.neg,r=S[d]||{},L2=r.neg_list||[],box=$("negbox");

  }});$("sheet").querySelector(".sheet-panel").scrollTop=0;

<svg id="b" xmlns="http://www.w3.org/2000/svg" width="1810" height="835" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1810 835"><style>
html,body{margin:0;background:#f4f4f2;font-family:"Helvetica Neue",Arial,sans-serif;color:#222}
nav{padding:8px 20px;background:#222;font-size:13px}nav a{color:#ddd;margin-right:18px;text-decoration:none}nav a.on{color:#fff;font-weight:700}

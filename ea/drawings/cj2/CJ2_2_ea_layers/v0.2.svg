.flow{fill:none;stroke:#333;stroke-width:2}
 svg{background:#fff} </style><rect width="1810" height="835" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#333"/></marker></defs><text class="col" x="312.5" y="26" text-anchor="middle">s1 Order captured</text><text class="col" x="577.5" y="26" text-anchor="middle">s2 Tab and table</text><text class="col" x="842.5" y="26" text-anchor="middle">s3 Kitchen ticket</text><text class="col" x="1107.5" y="26" text-anchor="middle">s4 Prepared</text><text class="col" x="1372.5" y="26" text-anchor="middle">s5 Served / handed over</text><text class="col" x="1637.5" y="26" text-anchor="middle">s6 Tab closed</text><rect class="lane" x="0" y="40" width="1810" height="120" fill="#f3f3f1"/><rect class="lab" x="0" y="40" width="170" height="120"/><text class="lt" x="12" y="62">UX Workflow</text><text class="ls" x="12" y="78">lane 5 · screens</text><line x1="180" y1="40" x2="180" y2="160" stroke="#c8c8c8"/><rect class="scr" x="188" y="50" width="118" height="28" rx="3"/><text class="scr-t" x="247" y="67" text-anchor="middle">Kobas QR page</text><rect class="scr" x="313" y="50" width="118" height="28" rx="3"/><text class="scr-t" x="372" y="67" text-anchor="middle">Kobas iPad</text><rect class="scr" x="188" y="86" width="118" height="28" rx="3"/><text class="scr-t" x="247" y="103" text-anchor="middle">Kobas till</text><rect class="scr" x="313" y="86" width="118" height="28" rx="3"/><text class="scr-t" x="372" y="103" text-anchor="middle">Slerp shop</text><rect class="scr" x="188" y="122" width="118" height="28" rx="3"/><text class="scr-t" x="247" y="139" text-anchor="middle">Deliveroo app</text><line x1="445" y1="40" x2="445" y2="160" stroke="#c8c8c8"/><rect class="scr" x="453" y="50" width="118" height="28" rx="3"/><text class="scr-t" x="512" y="67" text-anchor="middle">Kobas table plan</text><rect class="scr" x="578" y="50" width="118" height="28" rx="3"/><text class="scr-t" x="637" y="67" text-anchor="middle">Open tabs</text><line x1="710" y1="40" x2="710" y2="160" stroke="#c8c8c8"/><rect class="scr" x="718" y="50" width="118" height="28" rx="3"/><text class="scr-t" x="777" y="67" text-anchor="middle">Printer ticket</text><rect class="scr" x="843" y="50" width="118" height="28" rx="3"/><text class="scr-t" x="902" y="67" text-anchor="middle">KDS (if any)</text><rect class="scr" x="718" y="86" width="118" height="28" rx="3"/><text class="scr-t" x="777" y="103" text-anchor="middle">Slerp feed</text><line x1="975" y1="40" x2="975" y2="160" stroke="#c8c8c8"/><rect class="scr" x="983" y="50" width="118" height="28" rx="3"/><text class="scr-t" x="1042" y="67" text-anchor="middle">Pass / expo</text><rect class="scr" x="1108" y="50" width="118" height="28" rx="3"/><text class="scr-t" x="1167" y="67" text-anchor="middle">Mapal spec</text><line x1="1240" y1="40" x2="1240" y2="160" stroke="#c8c8c8"/><rect class="scr" x="1248" y="50" width="118" height="28" rx="3"/><text class="scr-t" x="1307" y="67" text-anchor="middle">Table service</text><rect class="scr" x="1373" y="50" width="118" height="28" rx="3"/><text class="scr-t" x="1432" y="67" text-anchor="middle">Collection counter</text><rect class="scr" x="1248" y="86" width="118" height="28" rx="3"/><text class="scr-t" x="1307" y="103" text-anchor="middle">Rider handover</text><line x1="1505" y1="40" x2="1505" y2="160" stroke="#c8c8c8"/><rect class="scr" x="1513" y="50" width="118" height="28" rx="3"/><text class="scr-t" x="1572" y="67" text-anchor="middle">Kobas payment</text><rect class="scr" x="1638" y="50" width="118" height="28" rx="3"/><text class="scr-t" x="1697" y="67" text-anchor="middle">Receipt</text><rect class="scr" x="1513" y="86" width="118" height="28" rx="3"/><text class="scr-t" x="1572" y="103" text-anchor="middle">Cash log</text><rect class="lane" x="0" y="160" width="1810" height="230" fill="#ece8f6"/><rect class="lab" x="0" y="160" width="170" height="230"/><text class="lt" x="12" y="182">Business Processes</text><text class="ls" x="12" y="198">lane 4 · Channels and</text><text class="ls" x="12" y="210">Customer Relationship</text><line x1="180" y1="160" x2="180" y2="390" stroke="#c8c8c8"/><ellipse class="st" cx="312.5" cy="190" rx="118" ry="17"/><text class="st-i" x="312.5" y="187" text-anchor="middle">CJ2.s1.u1</text><text class="st-t" x="312.5" y="199" text-anchor="middle">Orders by QR (Kobas)</text><ellipse class="st" cx="312.5" cy="232" rx="118" ry="17"/><text class="st-i" x="312.5" y="229" text-anchor="middle">CJ2.s1.u2</text><text class="st-t" x="312.5" y="241" text-anchor="middle">FOH takes order, iPad / till</text><ellipse class="st" cx="312.5" cy="274" rx="118" ry="17"/><text class="st-i" x="312.5" y="271" text-anchor="middle">CJ2.s1.u4</text><text class="st-t" x="312.5" y="283" text-anchor="middle">Delivery via Deliverect into Kobas</text><line x1="445" y1="160" x2="445" y2="390" stroke="#c8c8c8"/><ellipse class="st" cx="577.5" cy="190" rx="118" ry="17"/><text class="st-i" x="577.5" y="187" text-anchor="middle">CJ2.s2.u1</text><text class="st-t" x="577.5" y="199" text-anchor="middle">Tab and table kept right</text><line x1="710" y1="160" x2="710" y2="390" stroke="#c8c8c8"/><ellipse class="st" cx="842.5" cy="190" rx="118" ry="17"/><text class="st-i" x="842.5" y="187" text-anchor="middle">CJ2.s3.u1</text><text class="st-t" x="842.5" y="199" text-anchor="middle">Order reaches the kitchen</text><line x1="975" y1="160" x2="975" y2="390" stroke="#c8c8c8"/><ellipse class="st" cx="1107.5" cy="190" rx="118" ry="17"/><text class="st-i" x="1107.5" y="187" text-anchor="middle">CJ2.s4.u1</text><text class="st-t" x="1107.5" y="199" text-anchor="middle">Made to spec, bumped</text><line x1="1240" y1="160" x2="1240" y2="390" stroke="#c8c8c8"/><ellipse class="st" cx="1372.5" cy="190" rx="118" ry="17"/><text class="st-i" x="1372.5" y="187" text-anchor="middle">CJ2.s5.u1</text><text class="st-t" x="1372.5" y="199" text-anchor="middle">Guest receives the food</text><line x1="1505" y1="160" x2="1505" y2="390" stroke="#c8c8c8"/><ellipse class="st" cx="1637.5" cy="190" rx="118" ry="17"/><text class="st-i" x="1637.5" y="187" text-anchor="middle">CJ2.s6.u1</text><text class="st-t" x="1637.5" y="199" text-anchor="middle">Tab settled, table turned</text><rect class="lane" x="0" y="390" width="1810" height="215" fill="#e2f2e4"/><rect class="lab" x="0" y="390" width="170" height="215"/><text class="lt" x="12" y="412">Service Contracts</text><text class="ls" x="12" y="428">lane 3 · NONE YET ·</text><text class="ls" x="12" y="440">candidates derived from CJ2</text><line x1="180" y1="390" x2="180" y2="605" stroke="#c8c8c8"/><rect class="sc" x="188" y="400" width="249" height="57" rx="2"/><text class="sc-t" x="194" y="413">«contract» Se08 EPoS Order (hub)  (candidate)</text><text class="sc-o" x="198" y="426">+ openTab(Venue,Table,Covers)</text><text class="sc-o" x="198" y="437">+ addItems(Tab,Items[],Modifiers[])</text><text class="sc-o" x="198" y="448">+ sendOrder(Tab)</text><rect class="sc" x="188" y="463" width="249" height="57" rx="2"/><text class="sc-t" x="194" y="476">«contract» Se14 QR Order-at-Table  (candidate)</text><text class="sc-o" x="198" y="489">+ openQrSession(Venue,Table)</text><text class="sc-o" x="198" y="500">+ charge(Tab,Method)</text><text class="sc-o" x="198" y="511">+ submitOrder(Tab)</text><rect class="sc" x="188" y="526" width="249" height="35" rx="2"/><text class="sc-t" x="194" y="539">«contract» Se05 Delivery Ordering (Slerp)  (candidate)</text><text class="sc-o" x="198" y="552">+ placeOrder(Basket,Guest) via Deliverect</text><rect class="sc" x="188" y="567" width="249" height="35" rx="2"/><text class="sc-t" x="194" y="580">«contract» Se06 Marketplace Ordering (Deliveroo)  (candidate)</text><text class="sc-o" x="198" y="593">+ injectOrder(MktOrder,LocationId)</text><line x1="445" y1="390" x2="445" y2="605" stroke="#c8c8c8"/><rect class="sc" x="453" y="400" width="249" height="57" rx="2"/><text class="sc-t" x="459" y="413">«contract» Se15 Table Management  (candidate)</text><text class="sc-o" x="463" y="426">+ transferTab(Tab,Table)</text><text class="sc-o" x="463" y="437">+ splitTab(Tab,Parts)</text><text class="sc-o" x="463" y="448">+ voidItem(Tab,Line,Reason,Authoriser)</text><line x1="710" y1="390" x2="710" y2="605" stroke="#c8c8c8"/><rect class="sc" x="718" y="400" width="249" height="35" rx="2"/><text class="sc-t" x="724" y="413">«contract» Se09 Kitchen Ticket  (candidate)</text><text class="sc-o" x="728" y="426">+ dispatchToKitchen(Order): Ticket[] to printers</text><line x1="975" y1="390" x2="975" y2="605" stroke="#c8c8c8"/><rect class="sc" x="983" y="400" width="249" height="46" rx="2"/><text class="sc-t" x="989" y="413">«contract» Se16 Recipe / Spec  (candidate)</text><text class="sc-o" x="993" y="426">+ getSpec(Item): Recipe</text><text class="sc-o" x="993" y="437">+ bumpTicket(Ticket)</text><line x1="1240" y1="390" x2="1240" y2="605" stroke="#c8c8c8"/><rect class="sc" x="1248" y="400" width="249" height="68" rx="2"/><text class="sc-t" x="1254" y="413">«contract» Se17 Fulfilment / Handover  (candidate)</text><text class="sc-o" x="1258" y="426">+ serve(Ticket,Table,Seat)</text><text class="sc-o" x="1258" y="437">+ notifyReady(Order)</text><text class="sc-o" x="1258" y="448">+ handover(Order)</text><text class="sc-o" x="1258" y="459">+ assignCourier / pickup / deliver(Order)</text><line x1="1505" y1="390" x2="1505" y2="605" stroke="#c8c8c8"/><rect class="sc" x="1513" y="400" width="249" height="57" rx="2"/><text class="sc-t" x="1519" y="413">«contract» Se11 Sales Ledger  (candidate)</text><text class="sc-o" x="1523" y="426">+ closeTab(Tab,Payment[])</text><text class="sc-o" x="1523" y="437">+ freeTable(Table)</text><text class="sc-o" x="1523" y="448">+ settle(Batch)</text><rect class="lane" x="0" y="605" width="1810" height="150" fill="#fbeadb"/><rect class="lab" x="0" y="605" width="170" height="150"/><text class="lt" x="12" y="627">System</text><text class="ls" x="12" y="643">lane 2 · vendor systems /</text><text class="ls" x="12" y="655">components</text><line x1="180" y1="605" x2="180" y2="755" stroke="#c8c8c8"/><rect class="co" x="188" y="613" width="249" height="22" rx="2"/><text class="co-t" x="194" y="628">«Co7»</text><text class="co-s" x="232" y="628">Kobas front end: QR, iPad, till</text><rect class="co" x="188" y="640" width="249" height="22" rx="2"/><text class="co-t" x="194" y="655">«Co8»</text><text class="co-s" x="232" y="655">Slerp (via Deliverect)</text><rect class="co" x="188" y="667" width="249" height="22" rx="2"/><text class="co-t" x="194" y="682">«Co9»</text><text class="co-s" x="232" y="682">Deliveroo (via Deliverect)</text><rect class="co" x="188" y="694" width="249" height="22" rx="2"/><text class="co-t" x="194" y="709">«Co19»</text><text class="co-s" x="232" y="709">Deliverect (into Kobas)</text><rect class="co" x="188" y="721" width="249" height="22" rx="2"/><text class="co-t" x="194" y="736">«Co20»</text><text class="co-s" x="232" y="736">Worldpay (QR; pink 1)</text><rect class="co" x="188" y="748" width="249" height="22" rx="2"/><text class="co-t" x="194" y="763">«Co14»</text><text class="co-s" x="232" y="763">Stripe (Slerp)</text><line x1="445" y1="605" x2="445" y2="755" stroke="#c8c8c8"/><rect class="co" x="453" y="613" width="249" height="22" rx="2"/><text class="co-t" x="459" y="628">«Co7»</text><text class="co-s" x="497" y="628">Kobas tables / tabs</text><line x1="710" y1="605" x2="710" y2="755" stroke="#c8c8c8"/><rect class="co" x="718" y="613" width="249" height="22" rx="2"/><text class="co-t" x="724" y="628">«Co7»</text><text class="co-s" x="762" y="628">Kobas kitchen print</text><rect class="co" x="718" y="640" width="249" height="22" rx="2"/><text class="co-t" x="724" y="655">«Co21»</text><text class="co-s" x="762" y="655">Kitchen printers (no KDS)</text><line x1="975" y1="605" x2="975" y2="755" stroke="#c8c8c8"/><rect class="co" x="983" y="613" width="249" height="22" rx="2"/><text class="co-t" x="989" y="628">«Co22»</text><text class="co-s" x="1027" y="628">Mapal (recipes, allergens)</text><rect class="co" x="983" y="640" width="249" height="22" rx="2"/><text class="co-t" x="989" y="655">«Co7»</text><text class="co-s" x="1027" y="655">Kobas allergens (+ Slerp, Trifft copies)</text><line x1="1240" y1="605" x2="1240" y2="755" stroke="#c8c8c8"/><rect class="co" x="1248" y="613" width="249" height="22" rx="2"/><text class="co-t" x="1254" y="628">«Co9»</text><text class="co-s" x="1292" y="628">Deliveroo couriers (Deliveroo + Slerp)</text><rect class="co" x="1248" y="640" width="249" height="22" rx="2"/><text class="co-t" x="1254" y="655">«Co8»</text><text class="co-s" x="1292" y="655">Slerp collection notifications</text><line x1="1505" y1="605" x2="1505" y2="755" stroke="#c8c8c8"/><rect class="co" x="1513" y="613" width="249" height="22" rx="2"/><text class="co-t" x="1519" y="628">«Co7»</text><text class="co-s" x="1557" y="628">Kobas cash log (Delivery = Slerp + Deliveroo)</text><rect class="co" x="1513" y="640" width="249" height="22" rx="2"/><text class="co-t" x="1519" y="655">«Co13»</text><text class="co-s" x="1557" y="655">Dojo terminals</text><rect class="co" x="1513" y="667" width="249" height="22" rx="2"/><text class="co-t" x="1519" y="682">«Co15»</text><text class="co-s" x="1557" y="682">Xero</text><rect class="co" x="1513" y="694" width="249" height="22" rx="2"/><text class="co-t" x="1519" y="709">«Co18»</text><text class="co-s" x="1557" y="709">ops Auto Cash Up</text><rect class="lane" x="0" y="755" width="1810" height="70" fill="#e3eef9"/><rect class="lab" x="0" y="755" width="170" height="70"/><text class="lt" x="12" y="777">Infrastructure</text><text class="ls" x="12" y="793">lane 1 · domain independent</text><line x1="180" y1="755" x2="180" y2="825" stroke="#c8c8c8"/><line x1="445" y1="755" x2="445" y2="825" stroke="#c8c8c8"/><line x1="710" y1="755" x2="710" y2="825" stroke="#c8c8c8"/><line x1="975" y1="755" x2="975" y2="825" stroke="#c8c8c8"/><line x1="1240" y1="755" x2="1240" y2="825" stroke="#c8c8c8"/><line x1="1505" y1="755" x2="1505" y2="825" stroke="#c8c8c8"/><rect class="inf" x="188" y="771" width="1309" height="34" rx="3"/><text class="inf-t" x="198" y="792">Vendor cloud (Kobas, Slerp, Deliveroo, Deliverect, Dojo, Worldpay, Stripe, Mapal, Xero) plus on-site devices: iPads, tills, kitchen printers (no KDS). Data entities per vendor, see Ontology page.</text><rect class="inf" x="1509" y="771" width="253" height="34" rx="3"/><text class="inf-t" x="1519" y="792">GitHub cloud: makiramen/ops Pages + Actions</text><rect class="pink" x="188" y="355" width="249" height="15"/><text class="pink-t" x="193" y="366">1 QR acquirer: Worldpay, Stripe or Slerp?</text><rect class="pink" x="453" y="355" width="249" height="15"/><text class="pink-t" x="458" y="366">5 void reason captured?</text><rect class="pink" x="718" y="355" width="249" height="15"/><text class="pink-t" x="723" y="366">6 station routing rules where?</text><rect class="pink" x="983" y="355" width="249" height="15"/><text class="pink-t" x="988" y="366">7 allergen master of five copies?</text><path class="flow" d="M200 190 H1517.5" marker-end="url(#a)"/><rect class="note" x="1774" y="400" width="28" height="0"/></svg>
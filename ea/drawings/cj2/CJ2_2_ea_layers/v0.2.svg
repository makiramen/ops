.sc{fill:#fff;stroke:#2f7d2b;stroke-width:1.3;stroke-dasharray:5 3}.sc-t{font-size:9.5px;fill:#163a14;font-weight:700}.sc-o{font-size:8.5px;fill:#1f7a1f;font-family:Menlo,Consolas,monospace}

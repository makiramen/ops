<svg id="b" xmlns="http://www.w3.org/2000/svg" width="1260" height="880" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1260 880"><style>
html,body{margin:0;background:#f4f4f2;font-family:"Helvetica Neue",Arial,sans-serif;color:#222}
nav{padding:8px 20px;background:#222;font-size:13px}nav a{color:#ddd;margin-right:18px;text-decoration:none}nav a.on{color:#fff;font-weight:700}
header{padding:12px 20px;background:#fff;border-bottom:1px solid #ddd}header h1{font-size:16px;margin:0 0 4px;font-weight:600}header p{margin:0;font-size:12px;color:#555}
#wrap{overflow:auto;padding:16px 20px 40px}svg{display:block;background:#fff;border:1px solid #cfcfcf}
.grp{fill:#fafaf8;stroke:#999;stroke-width:1.2}.grp-t{font-size:12px;font-weight:700;fill:#444}
.co{fill:#fbd8b0;stroke:#d97a16;stroke-width:1.3}.co-t{font-size:10.5px;fill:#5a3000;font-weight:700}.co-s{font-size:9.5px;fill:#6b4a1a}
.se{fill:#d4efcf;stroke:#2f7d2b;stroke-width:1.3}.se-t{font-size:10px;fill:#163a14}
.inf{fill:#cfe3f7;stroke:#2a6db5}.inf-t{font-size:10px;fill:#123a66}
.pk{fill:#f9b7cf;stroke:#d8588a}.pk-t{font-size:9.5px;fill:#4a1230}
.e{fill:none;stroke:#444;stroke-width:1.6}.ed{fill:none;stroke:#b03060;stroke-width:1.4;stroke-dasharray:5 4}.em{fill:none;stroke:#999;stroke-width:1.2;stroke-dasharray:2 3}
.el{font-size:9px;fill:#333;paint-order:stroke;stroke:#fff;stroke-width:3px}
.eld{font-size:9px;fill:#b03060;paint-order:stroke;stroke:#fff;stroke-width:3px}
 svg{background:#fff} </style><rect width="1260" height="880" fill="#fff"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9z" fill="#444"/></marker><marker id="ad" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9z" fill="#b03060"/></marker></defs><rect class="grp" x="20" y="60" width="300" height="300" rx="4"/><text class="grp-t" x="30" y="78">«context» In-venue entry points (s1)</text><rect class="grp" x="20" y="400" width="300" height="330" rx="4"/><text class="grp-t" x="30" y="418">«context» Delivery and collection (s1, s5), both via Deliverect</text><rect class="grp" x="380" y="60" width="420" height="300" rx="4"/><text class="grp-t" x="390" y="78">«context» Kobas in-venue hub (s1, s2, s6)</text><rect class="grp" x="380" y="400" width="420" height="330" rx="4"/><text class="grp-t" x="390" y="418">«context» Kitchen (s3, s4)</text><rect class="grp" x="860" y="400" width="360" height="200" rx="4"/><text class="grp-t" x="870" y="418">«context» Handover (s5)</text><rect class="grp" x="860" y="60" width="360" height="300" rx="4"/><text class="grp-t" x="870" y="78">«context» Ledger (s6)</text><rect class="grp" x="860" y="640" width="360" height="90" rx="4"/><text class="grp-t" x="870" y="658">«context» In-house</text><path class="e" d="M300 105 C350 105, 350 132, 400 132" marker-end="url(#a)"/><text class="el" x="350" y="115.5" text-anchor="middle">openQrSession, submitOrder</text><path class="e" d="M300 155 C350 155, 350 132, 400 132" marker-end="url(#a)"/><text class="el" x="350" y="140.5" text-anchor="middle">sendOrder</text><path class="e" d="M300 205 C350 205, 350 132, 400 132" marker-end="url(#a)"/><text class="el" x="350" y="165.5" text-anchor="middle">sendOrder</text><path class="e" d="M300 265 C350 265, 350 132, 400 132" marker-end="url(#a)"/><text class="el" x="350" y="195.5" text-anchor="middle">meta_paymentsense_connect_enabled</text><path class="ed" d="M170 290 C170 290, 170 120, 170 120" marker-end="url(#ad)"/><text class="eld" x="170" y="202" text-anchor="middle">charge (pink 1: or Stripe / Slerp?)</text><path class="e" d="M170 640 C170 640, 170 660, 170 660" marker-end="url(#a)"/><text class="el" x="170" y="647" text-anchor="middle">orders</text><path class="e" d="M170 660 C380 660, 380 154, 590 154" marker-end="url(#a)"/><text class="el" x="380" y="404" text-anchor="middle">meta_deliverect_enabled, location_id</text><path class="e" d="M170 460 C170 460, 170 480, 170 480" marker-end="url(#a)"/><text class="el" x="170" y="467" text-anchor="middle">charge</text><path class="e" d="M170 460 C170 460, 170 660, 170 660" marker-end="url(#a)"/><text class="el" x="170" y="557" text-anchor="middle">orders (Michael 6 Nov)</text><path class="e" d="M170 460 C170 460, 170 530, 170 530" marker-end="url(#a)"/><text class="el" x="170" y="492" text-anchor="middle">assignCourier</text><path class="e" d="M590 154 C590 154, 590 440, 590 440" marker-end="url(#a)"/><text class="el" x="590" y="294" text-anchor="middle">dispatchToKitchen per station, every channel</text><path class="em" d="M590 600 C590 600, 590 470, 590 470" marker-end="url(#a)"/><text class="el" x="590" y="532" text-anchor="middle">spec at the pass</text><path class="e" d="M780 455 C830 455, 830 445, 880 445" marker-end="url(#a)"/><text class="el" x="830" y="447" text-anchor="middle">run to table</text><path class="e" d="M780 455 C830 455, 830 495, 880 495" marker-end="url(#a)"/><text class="el" x="830" y="472" text-anchor="middle">ready, collected</text><path class="e" d="M780 132 C830 132, 830 545, 880 545" marker-end="url(#a)"/><text class="el" x="830" y="335.5" text-anchor="middle">delivery ticket, pickup time</text><path class="e" d="M300 545 C590 545, 590 545, 880 545" marker-end="url(#a)"/><text class="el" x="590" y="542" text-anchor="middle">pick up</text><path class="e" d="M780 132 C830 132, 830 125, 880 125" marker-end="url(#a)"/><text class="el" x="830" y="125.5" text-anchor="middle">xero_enabled per venue</text><path class="e" d="M300 495 C590 495, 590 185, 880 185" marker-end="url(#a)"/><text class="el" x="590" y="337" text-anchor="middle">Stripe payout</text><path class="e" d="M1040 170 C1040 170, 1040 140, 1040 140" marker-end="url(#a)"/><text class="el" x="1040" y="152" text-anchor="middle">bank feed</text><path class="e" d="M590 154 C815 154, 815 670, 1040 670" marker-end="url(#a)"/><text class="el" x="815" y="409" text-anchor="middle">cash log via /data</text><rect class="co" x="40" y="90" width="260" height="30" rx="2"/><text class="co-t" x="48" y="103">«Co7»</text><text class="co-s" x="48" y="116">Kobas QR order-at-table page (guest phone)</text><rect class="co" x="40" y="140" width="260" height="30" rx="2"/><text class="co-t" x="48" y="153">«Co7»</text><text class="co-s" x="48" y="166">Kobas iPad EPoS app (staff at table)</text><rect class="co" x="40" y="190" width="260" height="30" rx="2"/><text class="co-t" x="48" y="203">«Co7»</text><text class="co-s" x="48" y="216">Kobas till (counter / walk-in)</text><rect class="co" x="40" y="250" width="260" height="30" rx="2"/><text class="co-t" x="48" y="263">«Co13»</text><text class="co-s" x="48" y="276">Dojo terminals (Kobas Connect)</text><rect class="co" x="40" y="290" width="260" height="30" rx="2"/><text class="co-t" x="48" y="303">«Co20»</text><text class="co-s" x="48" y="316">Worldpay: QR order-at-table (pink 1)</text><rect class="co" x="40" y="430" width="260" height="30" rx="2"/><text class="co-t" x="48" y="443">«Co8»</text><text class="co-s" x="48" y="456">Slerp: web shop, Stripe checkout</text><rect class="co" x="40" y="480" width="260" height="30" rx="2"/><text class="co-t" x="48" y="493">«Co14»</text><text class="co-s" x="48" y="506">Stripe (Slerp payments)</text><rect class="co" x="40" y="530" width="260" height="30" rx="2"/><text class="co-t" x="48" y="543">«Co9»</text><text class="co-s" x="48" y="556">Deliveroo couriers (Deliveroo and Slerp orders)</text><rect class="co" x="40" y="610" width="260" height="30" rx="2"/><text class="co-t" x="48" y="623">«Co9»</text><text class="co-s" x="48" y="636">Deliveroo (marketplace, rider network)</text><rect class="co" x="40" y="660" width="260" height="30" rx="2"/><text class="co-t" x="48" y="673">«Co19»</text><text class="co-s" x="48" y="686">Deliverect (Deliveroo + Slerp into Kobas)</text><rect class="co" x="400" y="110" width="380" height="44" rx="2"/><text class="co-t" x="408" y="123">«Co7»</text><text class="co-s" x="408" y="136">Kobas front end: tabs, tables, covers, consumption mode,</text><text class="co-s" x="408" y="147">orders, voids, payments, cash log</text><rect class="co" x="400" y="440" width="380" height="30" rx="2"/><text class="co-t" x="408" y="453">«Co21»</text><text class="co-s" x="408" y="466">Kitchen printers per station, every site, no KDS (routing: pink 6)</text><rect class="co" x="400" y="600" width="380" height="30" rx="2"/><text class="co-t" x="408" y="613">«Co22»</text><text class="co-s" x="408" y="626">Mapal: recipe specs, allergens (one of five allergen copies, pink 7)</text><rect class="co" x="880" y="430" width="320" height="30" rx="2"/><text class="co-t" x="888" y="443">«site»</text><text class="co-s" x="888" y="456">Table service by FOH to the seat number</text><rect class="co" x="880" y="480" width="320" height="30" rx="2"/><text class="co-t" x="888" y="493">«site»</text><text class="co-s" x="888" y="506">Collection counter handover</text><rect class="co" x="880" y="530" width="320" height="30" rx="2"/><text class="co-t" x="888" y="543">«Co9»</text><text class="co-s" x="888" y="556">Courier pickup at the counter (ready / picked-up statuses)</text><rect class="co" x="880" y="110" width="320" height="30" rx="2"/><text class="co-t" x="888" y="123">«Co15»</text><text class="co-s" x="888" y="136">Xero (per venue org)</text><rect class="co" x="880" y="170" width="320" height="30" rx="2"/><text class="co-t" x="888" y="183">«Bank»</text><text class="co-s" x="888" y="196">Company bank accounts</text><rect class="co" x="880" y="670" width="320" height="30" rx="2"/><text class="co-t" x="888" y="683">«Co18»</text><text class="co-s" x="888" y="696">makiramen/ops Auto Cash Up, KPI feeds</text><rect class="se" x="400" y="200" width="380" height="24" rx="2"/><text class="se-t" x="408" y="216">«provides» Se08 EPoS Order · Se14 QR · Se15 Table Mgmt</text><rect class="se" x="40" y="690" width="260" height="24" rx="2"/><text class="se-t" x="48" y="706">«provides» Se05 Delivery Ordering (separate)</text><rect class="se" x="400" y="690" width="380" height="24" rx="2"/><text class="se-t" x="408" y="706">«provides» Se09 Kitchen Ticket · Se16 Recipe / Spec</text><rect class="se" x="880" y="570" width="320" height="24" rx="2"/><text class="se-t" x="888" y="586">«provides» Se17 Fulfilment / Handover</text><rect class="se" x="880" y="230" width="320" height="24" rx="2"/><text class="se-t" x="888" y="246">«provides» Se11 Sales Ledger</text><rect class="inf" x="20" y="750" width="1200" height="34" rx="3"/><text class="inf-t" x="32" y="771">Infrastructure (lane 1): vendor cloud for Kobas, Slerp, Deliveroo, Deliverect, Dojo, Worldpay, Stripe, Mapal, Xero · on-site devices: iPads, tills, kitchen printers (no KDS) · GitHub cloud for Co18 · Service Contracts: none yet, candidates on page 2</text><rect class="pk" x="20" y="800" width="1200" height="40" rx="2"/><text class="pk-t" x="32" y="816">Open before this package is final: 1 QR acquirer (Worldpay, Stripe or Slerp) · 5 void reason captured · 6 station routing rules · 7 allergen master of five copies</text><text class="pk-t" x="32" y="831">Confirmed (Michael 6 Nov): QR is Kobas own module, all sites; iPads send the full order at once; Slerp and Deliveroo via Deliverect into Kobas, straight to the printer; Deliveroo couriers deliver both; seat numbers captured; printers everywhere, no KDS, no ticket times; Slerp and Deliveroo in the cash log under Delivery.</text></svg>
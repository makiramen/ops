<meta charset="utf-8">

<title>30% Promo Tracker</title>
<style>
:root{--bg:#faf8f5;--card:#ffffff;--ink:#1c1a17;--mute:#6b665e;--line:#e7e2da;--orange:#f26522;--orange-soft:#fde9df;--green:#2b8a3e;--red:#c92a2a;--amber:#c77d00}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15130f;--card:#1f1c17;--ink:#f1ece4;--mute:#a39c90;--line:#332e27;--orange:#f7813f;--orange-soft:#3a2416;--green:#5bc46d;--red:#ff6b6b;--amber:#f0b429}}
:root[data-theme="dark"]{--bg:#15130f;--card:#1f1c17;--ink:#f1ece4;--mute:#a39c90;--line:#332e27;--orange:#f7813f;--orange-soft:#3a2416;--green:#5bc46d;--red:#ff6b6b;--amber:#f0b429}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;padding:0 16px 48px}
.wrap{max-width:1100px;margin:0 auto}
header{padding:28px 0 12px;border-bottom:3px solid var(--orange);margin-bottom:18px}
h1{margin:0;font-size:24px;letter-spacing:-.01em}
h1 span{color:var(--orange)}
.sub{color:var(--mute);font-size:13px;margin-top:6px}
.stamp{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--orange-soft);color:var(--orange);font-weight:600;font-size:12px;margin-right:6px}
.warn{background:var(--orange-soft);border-left:4px solid var(--orange);padding:10px 12px;border-radius:6px;font-size:13px;margin:12px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:16px 0 24px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tile .k{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.tile .v{font-size:28px;font-weight:700;margin-top:2px}
.tile .d{font-size:12px;color:var(--mute);margin-top:4px}
.up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--amber)}
h2{font-size:17px;margin:28px 0 8px;display:flex;align-items:baseline;gap:10px}
h2 small{font-weight:400;color:var(--mute);font-size:13px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.03em;background:color-mix(in srgb,var(--card) 92%,var(--ink))}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
tr.tot td{font-weight:700;background:var(--orange-soft)}
.bar{display:inline-block;height:8px;background:var(--orange);border-radius:4px;vertical-align:middle;margin-left:6px;opacity:.85}
.na{color:var(--mute)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px}
.tabs button.on{background:var(--orange);border-color:var(--orange);color:#fff}
.scroll{overflow-x:auto}
.note{font-size:12.5px;color:var(--mute);margin-top:8px}
footer{margin-top:36px;color:var(--mute);font-size:12px;border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
